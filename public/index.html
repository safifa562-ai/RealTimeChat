<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tap Rush</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="game">

    <header>
      <div>
        <h1>⚡ Tap Rush</h1>
        <p>Tap fast. Beat your record.</p>
      </div>

      <button id="soundBtn" onclick="toggleSound()">🔊</button>
    </header>


    <section class="stats">

      <div class="stat">
        <span>🪙 Coins</span>
        <strong id="coins">0</strong>
      </div>

      <div class="stat">
        <span>🏆 Best</span>
        <strong id="best">0</strong>
      </div>

      <div class="stat">
        <span>⭐ Level</span>
        <strong id="level">1</strong>
      </div>

    </section>


    <section class="game-card">

      <div class="timer-box">
        <span>TIME</span>
        <strong id="time">30</strong>
      </div>

      <div class="combo">
        🔥 Combo ×<span id="combo">0</span>
      </div>


      <button
        id="tapButton"
        class="tap-button"
        onclick="tap()"
      >
        TAP!
      </button>


      <div class="score">
        <span>SCORE</span>
        <strong id="score">0</strong>
      </div>


      <button
        id="startButton"
        class="start-button"
        onclick="startGame()"
      >
        ▶ START GAME
      </button>


      <p id="message">
        Press START GAME
      </p>

    </section>


    <section class="progress-card">

      <div class="progress-title">
        <span>Level Progress</span>
        <span id="progressText">0 / 50</span>
      </div>

      <div class="progress">
        <div id="progressBar"></div>
      </div>

    </section>


    <section class="achievement-card">

      <h2>🏅 Achievements</h2>

      <div class="achievement" id="a10">
        <span>🔥</span>
        <div>
          <strong>First Steps</strong>
          <small>Reach 10 taps</small>
        </div>
      </div>

      <div class="achievement" id="a50">
        <span>⚡</span>
        <div>
          <strong>Speed Tapper</strong>
          <small>Reach 50 taps</small>
        </div>
      </div>

      <div class="achievement" id="a100">
        <span>👑</span>
        <div>
          <strong>Tap Master</strong>
          <small>Reach 100 taps</small>
        </div>
      </div>

    </section>


    <section class="record-card">

      <h2>🏆 Your Record</h2>

      <div class="record-row">
        <span>Best Score</span>
        <strong id="recordScore">0</strong>
      </div>

      <div class="record-row">
        <span>Total Taps</span>
        <strong id="totalTaps">0</strong>
      </div>

      <div class="record-row">
        <span>Total Coins</span>
        <strong id="totalCoins">0</strong>
      </div>

    </section>


    <button
      class="reset-button"
      onclick="resetGame()"
    >
      Reset Game
    </button>

  </div>


  <script src="app.js"></script>

</body>
</html>
