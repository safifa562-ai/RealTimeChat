
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeCircle - Clips</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #101010;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 18px;
  display: flex;
  justify-content: space-between;
  background: #181818;
  position: sticky;
  top: 0;
}

header h2 {
  color: #a970ff;
}

.stories {
  display: flex;
  gap: 15px;
  padding: 18px;
  overflow-x: auto;
}

.story {
  text-align: center;
  min-width: 65px;
}

.story img {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 3px solid #a970ff;
  object-fit: cover;
}

.story p {
  font-size: 12px;
  margin-top: 5px;
}

.section-title {
  padding: 12px 18px;
}

.reel {
  max-width: 430px;
  margin: 15px auto;
  background: #1b1b1b;
  border-radius: 14px;
  overflow: hidden;
}

.reel video {
  width: 100%;
  display: block;
  max-height: 580px;
  background: black;
}

.reel-info {
  padding: 15px;
}

.actions {
  display: flex;
  gap: 20px;
  margin-top: 12px;
}

.actions button {
  background: transparent;
  border: none;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.actions button:hover {
  color: #b78aff;
}

.upload {
  margin: 20px auto;
  padding: 18px;
  max-width: 430px;
  background: #1b1b1b;
  border-radius: 12px;
}

.upload input {
  margin-top: 12px;
  width: 100%;
}

.highlight {
  display: flex;
  gap: 12px;
  padding: 15px;
}

.highlight span {
  background: #292929;
  padding: 12px;
  border-radius: 10px;
}

</style>
</head>

<body>

<header>
  <h2>VibeCircle</h2>
  <span>🎬 Clips</span>
</header>

<h3 class="section-title">Stories</h3>

<div class="stories">
  <div class="story">
    <img src="https://i.pravatar.cc/100?img=1">
    <p>Your Story</p>
  </div>
  <div class="story">
    <img src="https://i.pravatar.cc/100?img=2">
    <p>Alex</p>
  </div>
  <div class="story">
    <img src="https://i.pravatar.cc/100?img=3">
    <p>Sarah</p>
  </div>
  <div class="story">
    <img src="https://i.pravatar.cc/100?img=4">
    <p>David</p>
  </div>
</div>

<h3 class="section-title">Highlights</h3>

<div class="highlight">
  <span>🌍 Travel</span>
  <span>🎵 Music</span>
  <span>📸 Memories</span>
</div>

<div class="upload">
  <h3>Upload your clip</h3>
  <input type="file" id="videoInput" accept="video/mp4,video/webm">
  <p id="uploadMessage" style="margin-top:10px;font-size:13px;color:#bbb">
    Choose a video to preview.
  </p>
</div>

<div id="reelsFeed">

  <div class="reel">
    <video controls loop playsinline
      src="https://www.w3schools.com/html/mov_bbb.mp4">
    </video>

    <div class="reel-info">
      <h3>@VibeCreator</h3>
      <p>Welcome to VibeCircle! ✨</p>

      <div class="actions">
        <button onclick="likePost(this)">♡ Like <span>0</span></button>
        <button onclick="commentPost()">💬 Comment</button>
        <button onclick="sharePost()">↗ Share</button>
      </div>
    </div>
  </div>

</div>

<script>
function likePost(button) {
  const count = button.querySelector("span");
  const liked = button.dataset.liked === "true";

  button.dataset.liked = String(!liked);
  count.textContent = Number(count.textContent) + (liked ? -1 : 1);
  button.firstChild.textContent = liked ? "♡ Like " : "♥ Liked ";
}

function commentPost() {
  const comment = prompt("Write your comment:");

  if (comment && comment.trim()) {
    alert("Comment preview: " + comment.trim());
  }
}

function sharePost() {
  if (navigator.share) {
    navigator.share({
      title: "VibeCircle",
      text: "Check out this clip!"
    }).catch(() => {});
  } else {
    alert("Sharing is not supported in this browser.");
  }
}

document.getElementById("videoInput").addEventListener("change", function() {
  const file = this.files[0];

  if (!file) return;

  if (!["video/mp4", "video/webm"].includes(file.type)) {
    alert("Please select an MP4 or WebM video.");
    this.value = "";
    return;
  }

  if (file.size > 30 * 1024 * 1024) {
    alert("Video must be smaller than 30 MB.");
    this.value = "";
    return;
  }

  const url = URL.createObjectURL(file);

  const reel = document.createElement("div");
  reel.className = "reel";

  const video = document.createElement("video");
  video.src = url;
  video.controls = true;
  video.loop = true;
  video.playsInline = true;

  const info = document.createElement("div");
  info.className = "reel-info";
  info.innerHTML = `
    <h3>@You</h3>
    <p>My new VibeCircle clip ✨</p>
    <div class="actions">
      <button onclick="likePost(this)">♡ Like <span>0</span></button>
      <button onclick="commentPost()">💬 Comment</button>
      <button onclick="sharePost()">↗ Share</button>
    </div>
  `;

  reel.append(video, info);
  document.getElementById("reelsFeed").prepend(reel);

  document.getElementById("uploadMessage").textContent =
    "Video preview added. It is not uploaded to the server.";

  this.value = "";
});
</script>

</body>
</html>
