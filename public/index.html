<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RealTimeChat</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

<div id="app">

  <header>
    <h2>💬 RealTimeChat</h2>
    <button onclick="logout()">Logout</button>
  </header>

  <!-- SEARCH -->
  <section>
    <h3>🔍 Find People</h3>

    <input
      id="searchInput"
      type="text"
      placeholder="Search username..."
      oninput="searchUsers()"
    >

    <div id="searchResults"></div>
  </section>

  <!-- REQUESTS -->
  <section>
    <h3>📩 Friend Requests</h3>
    <div id="requests"></div>
  </section>

  <!-- FRIENDS -->
  <section>
    <h3>👥 Friends</h3>
    <div id="friends"></div>
  </section>

</div>

<script src="/app.js"></script>

</body>
</html>
