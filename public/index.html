<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Time Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    .app {
      max-width: 600px;
      height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #202020;
      padding: 18px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    /* AUTH */

    #auth {
      width: 90%;
      max-width: 400px;
      margin: auto;
      text-align: center;
    }

    #auth h2 {
      margin-bottom: 20px;
    }

    #auth input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 13px 20px;
      margin: 5px;
      background: #2196f3;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .gray {
      background: #555;
    }

    /* CHAT */

    #chat {
      display: none;
      flex: 1;
      flex-direction: column;
    }

    .user-bar {
      background: #181818;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      background: #292929;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      word-wrap: break-word;
    }

    .message-name {
      font-weight: bold;
    }

    .message-time {
      display: block;
      color: #aaa;
      font-size: 11px;
      margin-top: 5px;
    }

    .send-box {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #202020;
    }

    .send-box input {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    💬 Real Time Chat
  </div>

  <!-- LOGIN / SIGNUP -->

  <div id="auth">

    <h2 id="authTitle">Login</h2>

    <input
      id="username"
      type="text"
      placeholder="Username"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button id="mainButton" onclick="login()">
      Login
    </button>

    <button
      id="switchButton"
      class="gray"
      onclick="showSignup()"
    >
      Create Account
    </button>

  </div>

  <!-- CHAT -->

  <div id="chat">

    <div class="user-bar">

      <span>
        👤 <b id="currentUser"></b>
      </span>

      <button
        class="gray"
        onclick="logout()"
      >
        Logout
      </button>

    </div>

    <div id="messages"></div>

    <div class="send-box">

      <input
        id="messageInput"
        type="text"
        placeholder="Type a message..."
        onkeydown="if(event.key === 'Enter') sendMessage()"
      >

      <button onclick="sendMessage()">
        Send
      </button>

    </div>

  </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

let currentUsername = "";

let signupMode = false;


/* SHOW SIGNUP */

function showSignup() {

  signupMode = true;

  document.getElementById("authTitle").textContent =
    "Create Account";

  document.getElementById("mainButton").textContent =
    "Signup";

  document.getElementById("mainButton").onclick =
    signup;

  document.getElementById("switchButton").textContent =
    "Back to Login";

  document.getElementById("switchButton").onclick =
    showLogin;
}


/* SHOW LOGIN */

function showLogin() {

  signupMode = false;

  document.getElementById("authTitle").textContent =
    "Login";

  document.getElementById("mainButton").textContent =
    "Login";

  document.getElementById("mainButton").onclick =
    login;

  document.getElementById("switchButton").textContent =
    "Create Account";

  document.getElementById("switchButton").onclick =
    showSignup;
}


/* SIGNUP */

function signup() {

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  if (!username || !password) {

    alert("Please enter username and password");

    return;
  }

  if (username.length < 3) {

    alert("Username must be at least 3 characters");

    return;
  }

  if (password.length < 4) {

    alert("Password must be at least 4 characters");

    return;
  }

  const users =
    JSON.parse(
      localStorage.getItem("users") || "{}"
    );

  if (users[username]) {

    alert("Username already exists");

    return;
  }

  users[username] = password;

  localStorage.setItem(
    "users",
    JSON.stringify(users)
  );

  alert("Account created successfully!");

  document.getElementById("password").value = "";

  showLogin();
}


/* LOGIN */

function login() {

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  const users =
    JSON.parse(
      localStorage.getItem("users") || "{}"
    );

  if (!users[username]) {

    alert("Account not found. Create an account first.");

    return;
  }

  if (users[username] !== password) {

    alert("Wrong password");

    return;
  }

  currentUsername = username;

  document.getElementById("auth").style.display =
    "none";

  document.getElementById("chat").style.display =
    "flex";

  document.getElementById("currentUser").textContent =
    currentUsername;
}


/* LOGOUT */

function logout() {

  currentUsername = "";

  document.getElementById("chat").style.display =
    "none";

  document.getElementById("auth").style.display =
    "block";

  document.getElementById("username").value = "";

  document.getElementById("password").value = "";

  showLogin();
}


/* SEND MESSAGE */

function sendMessage() {

  const input =
    document.getElementById("messageInput");

  const message =
    input.value.trim();

  if (!message) return;

  socket.emit("chat message", {

    name: currentUsername,

    message: message

  });

  input.value = "";
}


/* RECEIVE MESSAGE */

socket.on("chat message", function(data) {

  const messages =
    document.getElementById("messages");

  const div =
    document.createElement("div");

  div.className = "message";

  const name =
    document.createElement("div");

  name.className = "message-name";

  name.textContent =
    data.name;

  const text =
    document.createElement("div");

  text.textContent =
    data.message;

  const time =
    document.createElement("span");

  time.className = "message-time";

  time.textContent =
    data.time;

  div.appendChild(name);

  div.appendChild(text);

  div.appendChild(time);

  messages.appendChild(div);

  messages.scrollTop =
    messages.scrollHeight;
});

</script>

</body>
</html>
