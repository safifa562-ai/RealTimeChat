<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RealTimeChat DM</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <!-- APP -->
  <div class="app">

    <!-- TOP BAR -->
    <div class="topbar">
      <h2>Messages</h2>
      <button class="new-chat">✎</button>
    </div>

    <!-- SEARCH -->
    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="🔍 Search"
      >
    </div>

    <!-- CHAT LIST -->
    <div class="chat-list">

      <div class="chat-user" onclick="openChat('Alex')">
        <div class="avatar">A</div>

        <div class="user-info">
          <b>Alex</b>
          <span>Hey! 👋</span>
        </div>

        <small>2m</small>
      </div>

      <div class="chat-user" onclick="openChat('Rahul')">
        <div class="avatar">R</div>

        <div class="user-info">
          <b>Rahul</b>
          <span>See you tomorrow</span>
        </div>

        <small>10m</small>
      </div>

      <div class="chat-user" onclick="openChat('Sara')">
        <div class="avatar">S</div>

        <div class="user-info">
          <b>Sara</b>
          <span>😊</span>
        </div>

        <small>1h</small>
      </div>

    </div>

  </div>


  <!-- PRIVATE CHAT -->
  <div id="chatScreen" class="chat-screen">

    <!-- CHAT HEADER -->
    <div class="chat-header">

      <button onclick="closeChat()">←</button>

      <div class="avatar small-avatar" id="chatAvatar">
        A
      </div>

      <div>
        <b id="chatName">Alex</b>
        <span class="online">● Online</span>
      </div>

    </div>


    <!-- MESSAGES -->
    <div id="messages" class="messages">

      <div class="received">
        Hey! 👋
      </div>

      <div class="sent">
        Hello! 😊
      </div>

    </div>


    <!-- MESSAGE BOX -->
    <div class="message-box">

      <button class="emoji-btn" onclick="addEmoji()">
        😊
      </button>

      <input
        type="text"
        id="messageInput"
        placeholder="Message..."
        onkeydown="handleEnter(event)"
      >

      <button class="send-btn" onclick="sendMessage()">
        ➤
      </button>

    </div>

  </div>


  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>

</body>
</html>
