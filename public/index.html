<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>RealTimeChat</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">

  <meta name="theme-color" content="#111111">

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="RealTimeChat"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* AUTH */

    #authScreen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #111;
    }

    .authBox {
      width: 100%;
      max-width: 420px;
      background: #1d1d1d;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }

    .authBox h1 {
      text-align: center;
      margin-top: 0;
    }

    .authBox h2 {
      margin-bottom: 10px;
    }

    .authBox input {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border: 1px solid #444;
      border-radius: 9px;
      background: #292929;
      color: white;
      outline: none;
    }

    .authButtons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .primaryBtn {
      background: #2563eb;
      color: white;
      border: 0;
      padding: 13px;
      border-radius: 9px;
    }

    .secondaryBtn {
      background: #333;
      color: white;
      border: 0;
      padding: 13px;
      border-radius: 9px;
    }

    #authMessage {
      text-align: center;
      margin-top: 15px;
      min-height: 20px;
    }

    /* APP */

    #appScreen {
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 300px;
      background: #181818;
      border-right: 1px solid #333;
      padding: 18px;
      overflow-y: auto;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .profile {
      background: #242424;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .profileName {
      font-size: 18px;
      font-weight: bold;
    }

    .userId {
      color: #aaa;
      font-size: 13px;
      margin-top: 5px;
    }

    .connectBox {
      margin-bottom: 15px;
    }

    .connectBox input {
      width: 100%;
      padding: 11px;
      border: 1px solid #444;
      background: #292929;
      color: white;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .connectBtn {
      width: 100%;
      padding: 11px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
    }

    .usersTitle {
      font-weight: bold;
      margin: 20px 0 10px;
    }

    #usersList {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .userItem {
      padding: 12px;
      background: #242424;
      border-radius: 9px;
      cursor: pointer;
    }

    .userItem:hover {
      background: #303030;
    }

    .onlineDot {
      display: inline-block;
      width: 9px;
      height: 9px;
      background: #22c55e;
      border-radius: 50%;
      margin-right: 7px;
    }

    .offlineDot {
      display: inline-block;
      width: 9px;
      height: 9px;
      background: #777;
      border-radius: 50%;
      margin-right: 7px;
    }

    .logoutBtn {
      width: 100%;
      margin-top: 20px;
      padding: 11px;
      background: #7f1d1d;
      color: white;
      border: 0;
      border-radius: 8px;
    }

    /* CHAT */

    .chatArea {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chatHeader {
      min-height: 70px;
      padding: 12px 18px;
      background: #181818;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .chatUserName {
      font-size: 18px;
      font-weight: bold;
    }

    .callButtons {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .callBtn {
      border: 0;
      border-radius: 8px;
      padding: 9px 12px;
      color: white;
    }

    .audioBtn {
      background: #16a34a;
    }

    .videoBtn {
      background: #2563eb;
    }

    .screenBtn {
      background: #7c3aed;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      background: #101010;
    }

    .message {
      max-width: 75%;
      padding: 10px 13px;
      border-radius: 13px;
      word-break: break-word;
    }

    .mine {
      align-self: flex-end;
      background: #2563eb;
    }

    .theirs {
      align-self: flex-start;
      background: #292929;
    }

    .messageTime {
      font-size: 10px;
      opacity: .7;
      margin-top: 4px;
    }

    .emptyChat {
      margin: auto;
      color: #777;
      text-align: center;
    }

    .messageBar {
      padding: 12px;
      background: #181818;
      border-top: 1px solid #333;
      display: flex;
      gap: 8px;
    }

    .messageBar input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      background: #292929;
      color: white;
      border: 1px solid #444;
      border-radius: 9px;
    }

    .sendBtn,
    .fileBtn {
      border: 0;
      border-radius: 9px;
      padding: 10px 14px;
      color: white;
    }

    .sendBtn {
      background: #2563eb;
    }

    .fileBtn {
      background: #444;
    }

    #fileInput {
      display: none;
    }

    /* CALL POPUP */

    #incomingCall {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .callPopup {
      width: min(90%, 360px);
      background: #222;
      padding: 25px;
      border-radius: 18px;
      text-align: center;
    }

    .callPopup h2 {
      margin-top: 0;
    }

    .callPopup button {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      margin: 5px;
      color: white;
    }

    .acceptCall {
      background: #16a34a;
    }

    .rejectCall {
      background: #dc2626;
    }

    /* VIDEO */

    #videoPanel {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: min(420px, 90vw);
      background: #000;
      border-radius: 15px;
      padding: 10px;
      z-index: 900;
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
    }

    .videos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    video {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      background: #050505;
      border-radius: 10px;
    }

    .videoControls {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }

    .videoControls button {
      padding: 9px 12px;
      border: 0;
      border-radius: 8px;
      background: #333;
      color: white;
    }

    .endCall {
      background: #dc2626 !important;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      #appScreen {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: auto;
        max-height: 42vh;
        border-right: 0;
        border-bottom: 1px solid #333;
      }

      .logo {
        margin-bottom: 10px;
      }

      .usersTitle {
        margin-top: 12px;
      }

      .chatHeader {
        min-height: auto;
        align-items: flex-start;
        flex-direction: column;
      }

      .callButtons {
        width: 100%;
      }

      .callBtn {
        flex: 1;
      }

      .message {
        max-width: 88%;
      }

      .messageBar {
        padding: 8px;
      }

      .sendBtn,
      .fileBtn {
        padding: 10px;
      }

      .videos {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- ================= AUTH SCREEN ================= -->

  <section id="authScreen">

    <div class="authBox">

      <h1>💬 RealTimeChat</h1>

      <h2>Login</h2>

      <input
        id="loginUsername"
        type="text"
        placeholder="Username"
        autocomplete="username"
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        class="primaryBtn"
        style="width:100%;"
        onclick="login()"
      >
        Login
      </button>

      <hr style="border-color:#333; margin:25px 0;">

      <h2>Create Account</h2>

      <input
        id="registerUsername"
        type="text"
        placeholder="Choose username"
        autocomplete="username"
      >

      <input
        id="registerPassword"
        type="password"
        placeholder="Create password"
        autocomplete="new-password"
      >

      <div class="authButtons">

        <button
          class="primaryBtn"
          onclick="register()"
        >
          Register
        </button>

        <button
          class="secondaryBtn"
          onclick="clearAuth()"
        >
          Clear
        </button>

      </div>

      <div id="authMessage"></div>

    </div>

  </section>


  <!-- ================= MAIN APP ================= -->

  <section
    id="appScreen"
    class="hidden"
  >

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="logo">
        💬 RealTimeChat
      </div>

      <div class="profile">

        <div
          id="profileName"
          class="profileName"
        >
          User
        </div>

        <div
          id="profileId"
          class="userId"
        >
          ID: -
        </div>

      </div>

      <div class="connectBox">

        <input
          id="connectUserId"
          type="number"
          placeholder="Enter User ID"
        >

        <button
          class="connectBtn"
          onclick="connectUser()"
        >
          Connect User
        </button>

      </div>

      <div class="usersTitle">
        Users
      </div>

      <div id="usersList"></div>

      <button
        class="logoutBtn"
        onclick="logout()"
      >
        Logout
      </button>

    </aside>


    <!-- CHAT AREA -->

    <main class="chatArea">

      <header class="chatHeader">

        <div>

          <div
            id="chatUserName"
            class="chatUserName"
          >
            Select a user
          </div>

          <small
            id="chatUserStatus"
            style="color:#888;"
          >
            No conversation selected
          </small>

        </div>

        <div class="callButtons">

          <button
            class="callBtn audioBtn"
            onclick="startAudioCall()"
          >
            📞 Audio
          </button>

          <button
            class="callBtn videoBtn"
            onclick="startVideoCall()"
          >
            📹 Video
          </button>

          <button
            class="callBtn screenBtn"
            onclick="shareScreen()"
          >
            🖥️ Screen
          </button>

        </div>

      </header>


      <div id="messages">

        <div class="emptyChat">
          Connect with a user to start chatting.
        </div>

      </div>


      <div class="messageBar">

        <label
          class="fileBtn"
          for="fileInput"
        >
          📎
        </label>

        <input
          id="fileInput"
          type="file"
          onchange="uploadFile()"
        >

        <input
          id="messageInput"
          type="text"
          placeholder="Type a message..."
          onkeydown="handleMessageKey(event)"
        >

        <button
          class="sendBtn"
          onclick="sendMessage()"
        >
          Send
        </button>

      </div>

    </main>

  </section>


  <!-- ================= INCOMING CALL ================= -->

  <div
    id="incomingCall"
    class="hidden"
  >

    <div class="callPopup">

      <h2>📞 Incoming Call</h2>

      <p id="callerText">
        Someone is calling...
      </p>

      <button
        class="acceptCall"
        onclick="acceptCall()"
      >
        Accept
      </button>

      <button
        class="rejectCall"
        onclick="rejectCall()"
      >
        Reject
      </button>

    </div>

  </div>


  <!-- ================= VIDEO PANEL ================= -->

  <div
    id="videoPanel"
    class="hidden"
  >

    <div class="videos">

      <video
        id="localVideo"
        autoplay
        muted
        playsinline
      ></video>

      <video
        id="remoteVideo"
        autoplay
        playsinline
      ></video>

    </div>

    <div class="videoControls">

      <button onclick="toggleMute()">
        🎤 Mute
      </button>

      <button onclick="toggleCamera()">
        📷 Camera
      </button>

      <button
        class="endCall"
        onclick="endCall()"
      >
        ❌ End
      </button>

    </div>

  </div>


  <!-- SOCKET.IO -->

  <script src="/socket.io/socket.io.js"></script>

  <script>

    /* =====================================================
       GLOBAL VARIABLES
    ===================================================== */

    let socket = null;

    let currentUser = null;
    let selectedUser = null;

    let localStream = null;
    let peerConnection = null;

    let incomingCallData = null;

    let pendingCallType = "audio";

    const peers = {};

    const rtcConfig = {
      iceServers: [
        {
          urls: "stun:stun.l.google.com:19302"
        }
      ]
    };


    /* =====================================================
       AUTH MESSAGE
    ===================================================== */

    function showAuthMessage(message, success = false) {

      const box =
        document.getElementById("authMessage");

      box.textContent = message;

      box.style.color =
        success ? "#22c55e" : "#ef4444";
    }


    function clearAuth() {

      document.getElementById(
        "loginUsername"
      ).value = "";

      document.getElementById(
        "loginPassword"
      ).value = "";

      document.getElementById(
        "registerUsername"
      ).value = "";

      document.getElementById(
        "registerPassword"
      ).value = "";

      showAuthMessage("");
    }


    /* =====================================================
       REGISTER
    ===================================================== */

    async function register() {

      const username =
        document.getElementById(
          "registerUsername"
        ).value.trim();

      const password =
        document.getElementById(
          "registerPassword"
        ).value;

      if (!username || !password) {

        showAuthMessage(
          "Enter username and password"
        );

        return;
      }

      try {

        const response =
          await fetch("/api/register", {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              username,
              password
            })

          });

        const data =
          await response.json();

        if (!response.ok) {

          showAuthMessage(
            data.error ||
            "Registration failed"
          );

          return;
        }

        showAuthMessage(
          "Account created successfully!",
          true
        );

        document.getElementById(
          "loginUsername"
        ).value = username;

        document.getElementById(
          "loginPassword"
        ).value = password;

      } catch (error) {

        console.error(error);

        showAuthMessage(
          "Server connection failed"
        );
      }
    }


    /* =====================================================
       LOGIN
    ===================================================== */

    async function login() {

      const username =
        document.getElementById(
          "loginUsername"
        ).value.trim();

      const password =
        document.getElementById(
          "loginPassword"
        ).value;

      if (!username || !password) {

        showAuthMessage(
          "Enter username and password"
        );

        return;
      }

      try {

        const response =
          await fetch("/api/login", {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              username,
              password
            })

          });

        const data =
          await response.json();

        if (!response.ok) {

          showAuthMessage(
            data.error ||
            "Login failed"
          );

          return;
        }

        localStorage.setItem(
          "rtc_user",
          JSON.stringify(data.user)
        );

        localStorage.setItem(
          "rtc_token",
          data.token
        );

        currentUser = data.user;

        openApp();

      } catch (error) {

        console.error(error);

        showAuthMessage(
          "Server connection failed"
        );
      }
    }


    /* =====================================================
       OPEN APP
    ===================================================== */

    function openApp() {

      document
        .getElementById("authScreen")
        .classList.add("hidden");

      document
        .getElementById("appScreen")
        .classList.remove("hidden");

      document
        .getElementById("profileName")
        .textContent =
        currentUser.username;

      document
        .getElementById("profileId")
        .textContent =
        "ID: " + currentUser.id;

      connectSocket();

      loadUsers();
    }


    /* =====================================================
       SOCKET CONNECTION
    ===================================================== */

    function connectSocket() {

      if (socket) return;

      socket = io();

      socket.on("connect", () => {

        console.log(
          "Socket connected"
        );

        socket.emit(
          "user-online",
          currentUser
        );

      });


      socket.on(
        "online-users",
        (ids) => {

          updateUsersList(ids);

        }
      );


      socket.on(
        "private-message",
        (message) => {

          displayMessage(message);

        }
      );


      socket.on(
        "incoming-call",
        (data) => {

          incomingCallData = data;

          document.getElementById(
            "callerText"
          ).textContent =
            "Incoming " +
            (data.callType || "audio") +
            " call";

          document
            .getElementById(
              "incomingCall"
            )
            .classList.remove("hidden");

        }
      );


      socket.on(
        "call-offer",
        async (data) => {

          incomingCallData = data;

        }
      );


      socket.on(
        "call-answer",
        async (data) => {

          if (!peerConnection) return;

          await peerConnection.setRemoteDescription(
            new RTCSessionDescription(
              data.answer
            )
          );

        }
      );


      socket.on(
        "ice-candidate",
        async (data) => {

          try {

            if (
              peerConnection &&
              data.candidate
            ) {

              await peerConnection.addIceCandidate(
                new RTCIceCandidate(
                  data.candidate
                )
              );

            }

          } catch (error) {

            console.error(
              "ICE error:",
              error
            );

          }

        }
      );


      socket.on(
        "end-call",
        () => {

          closeCall();

        }
      );

    }


    /* =====================================================
       LOAD USERS
    ===================================================== */

    async function loadUsers() {

      try {

        const response =
          await fetch("/api/users");

        const users =
          await response.json();

        const onlineIds =
          users
            .filter(user => user.online)
            .map(user => String(user.id));

        updateUsersList(onlineIds);

      } catch (error) {

        console.error(error);

      }
    }


    /* =====================================================
       USER LIST
    ===================================================== */

    function updateUsersList(
      onlineIds = []
    ) {

      fetch("/api/users")
        .then(response =>
          response.json()
        )
        .then(users => {

          const list =
            document.getElementById(
              "usersList"
            );

          list.innerHTML = "";

          users.forEach(user => {

            if (
              currentUser &&
              user.id === currentUser.id
            ) {
              return;
            }

            const div =
              document.createElement("div");

            div.className =
              "userItem";

            const online =
              onlineIds.includes(
                String(user.id)
              );

            div.innerHTML = `
              <span class="${
                online
                  ? "onlineDot"
                  : "offlineDot"
              }"></span>
              ${escapeHtml(user.username)}
              <small style="color:#777;">
                ID: ${user.id}
              </small>
            `;

            div.onclick = () => {

              selectedUser = user;

              document.getElementById(
                "chatUserName"
              ).textContent =
                user.username;

              document.getElementById(
                "chatUserStatus"
              ).textContent =
                online
                  ? "Online"
                  : "Offline";

              document.getElementById(
                "messages"
              ).innerHTML = "";

            };

            list.appendChild(div);

          });

        })
        .catch(error =>
          console.error(error)
        );
    }


    /* =====================================================
       CONNECT USER
    ===================================================== */

    function connectUser() {

      const id =
        Number(
          document.getElementById(
            "connectUserId"
          ).value
        );

      if (!id) {

        alert(
          "Enter a valid User ID"
        );

        return;
      }

      fetch("/api/users")
        .then(response =>
          response.json()
        )
        .then(users => {

          const user =
            users.find(
              u => u.id === id
            );

          if (!user) {

            alert(
              "User not found"
            );

            return;
          }

          selectedUser = user;

          document.getElementById(
            "chatUserName"
          ).textContent =
            user.username;

          document.getElementById(
            "chatUserStatus"
          ).textContent =
            user.online
              ? "Online"
              : "Offline";

          document.getElementById(
            "messages"
          ).innerHTML = "";

        });

    }


    /* =====================================================
       SEND MESSAGE
    ===================================================== */

    function sendMessage() {

      const input =
        document.getElementById(
          "messageInput"
        );

      const message =
        input.value.trim();

      if (!message) return;

      if (!selectedUser) {

        alert(
          "Select a user first"
        );

        return;
      }

      if (!socket) {

        alert(
          "Socket is not connected"
        );

        return;
      }

      socket.emit(
        "private-message",
        {
          senderId:
            currentUser.id,

          receiverId:
            selectedUser.id,

          message
        }
      );

      input.value = "";

    }


    function handleMessageKey(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        sendMessage();

      }

    }


    /* =====================================================
       DISPLAY MESSAGE
    ===================================================== */

    function displayMessage(message) {

      const container =
        document.getElementById(
          "messages"
        );

      const empty =
        container.querySelector(
          ".emptyChat"
        );

      if (empty) {
        empty.remove();
      }

      const div =
        document.createElement("div");

      div.className =
        "message " +
        (
          Number(message.sender_id) ===
          Number(currentUser.id)
            ? "mine"
            : "theirs"
        );

      const time =
        new Date(
          message.created_at
        ).toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        });

      div.innerHTML = `
        <div>${escapeHtml(
          message.message
        )}</div>

        <div class="messageTime">
          ${time}
        </div>
      `;

      container.appendChild(div);

      container.scrollTop =
        container.scrollHeight;

    }


    /* =====================================================
       AUDIO CALL
    ===================================================== */

    async function startAudioCall() {

      await startCall("audio");

    }


    /* =====================================================
       VIDEO CALL
    ===================================================== */

    async function startVideoCall() {

      await startCall("video");

    }


    /* =====================================================
       START CALL
    ===================================================== */

    async function startCall(
      callType
    ) {

      if (!selectedUser) {

        alert(
          "Select a user first"
        );

        return;
      }

      try {

        localStream =
          await navigator.mediaDevices.getUserMedia(
            {
              audio: true,
              video:
                callType === "video"
            }
          );

        showLocalStream();

        peerConnection =
          createPeerConnection();

        localStream
          .getTracks()
          .forEach(track => {

            peerConnection.addTrack(
              track,
              localStream
            );

          });

        const offer =
          await peerConnection.createOffer();

        await peerConnection.setLocalDescription(
          offer
        );

        socket.emit(
          "start-call",
          {
            receiverId:
              selectedUser.id,

            callerId:
              currentUser.id,

            callerName:
              currentUser.username,

            callType
          }
        );

        socket.emit(
          "call-offer",
          {
            receiverId:
              selectedUser.id,

            callerId:
              currentUser.id,

            callType,

            offer
          }
        );

      } catch (error) {

        console.error(error);

        alert(
          "Camera/microphone permission is required."
        );

      }

    }


    /* =====================================================
       PEER CONNECTION
    ===================================================== */

    function createPeerConnection() {

      const pc =
        new RTCPeerConnection(
          rtcConfig
        );

      pc.onicecandidate =
        event => {

          if (
            event.candidate &&
            selectedUser
          ) {

            socket.emit(
              "ice-candidate",
              {
                receiverId:
                  selectedUser.id,

                candidate:
                  event.candidate
              }
            );

          }

        };


      pc.ontrack =
        event => {

          const remoteVideo =
            document.getElementById(
              "remoteVideo"
            );

          remoteVideo.srcObject =
            event.streams[0];

        };


      pc.onconnectionstatechange =
        () => {

          console.log(
            "WebRTC:",
            pc.connectionState
          );

          if (
            pc.connectionState ===
            "failed"
          ) {

            closeCall();

          }

        };

      return pc;

    }


    /* =====================================================
       ACCEPT CALL
    ===================================================== */

    async function acceptCall() {

      document
        .getElementById(
          "incomingCall"
        )
        .classList.add("hidden");

      if (!incomingCallData) {
        return;
      }

      const data =
        incomingCallData;

      selectedUser = {
        id: data.callerId,
        username:
          data.callerName ||
          "Caller"
      };

      try {

        const video =
          data.callType ===
          "video";

        localStream =
          await navigator.mediaDevices.getUserMedia(
            {
              audio: true,
              video
            }
          );

        showLocalStream();

        peerConnection =
          createPeerConnection();

        localStream
          .getTracks()
          .forEach(track => {

            peerConnection.addTrack(
              track,
              localStream
            );

          });

        if (data.offer) {

          await peerConnection.setRemoteDescription(
            new RTCSessionDescription(
              data.offer
            )
          );

          const answer =
            await peerConnection.createAnswer();

          await peerConnection.setLocalDescription(
            answer
          );

          socket.emit(
            "call-answer",
            {
              receiverId:
                data.callerId,

              answer
            }
          );

        }

      } catch (error) {

        console.error(error);

        alert(
          "Could not access microphone/camera."
        );

      }

    }


    /* =====================================================
       REJECT CALL
    ===================================================== */

    function rejectCall() {

      document
        .getElementById(
          "incomingCall"
        )
        .classList.add("hidden");

      incomingCallData = null;

    }


    /* =====================================================
       LOCAL VIDEO
    ===================================================== */

    function showLocalStream() {

      const video =
        document.getElementById(
          "localVideo"
        );

      video.srcObject =
        localStream;

      document
        .getElementById(
          "videoPanel"
        )
        .classList.remove("hidden");

    }


    /* =====================================================
       MUTE
    ===================================================== */

    function toggleMute() {

      if (!localStream) return;

      const audioTracks =
        localStream.getAudioTracks();

      audioTracks.forEach(track => {

        track.enabled =
          !track.enabled;

      });

    }


    /* =====================================================
       CAMERA
    ===================================================== */

    function toggleCamera() {

      if (!localStream) return;

      const videoTracks =
        localStream.getVideoTracks();

      videoTracks.forEach(track => {

        track.enabled =
          !track.enabled;

      });

    }


    /* =====================================================
       SCREEN SHARE
    ===================================================== */

    async function shareScreen() {

      if (!selectedUser) {

        alert(
          "Select a user first"
        );

        return;
      }

      try {

        const screenStream =
          await navigator.mediaDevices.getDisplayMedia(
            {
              video: true,
              audio: true
            }
          );

        const screenTrack =
          screenStream.getVideoTracks()[0];

        if (
          peerConnection
        ) {

          const sender =
            peerConnection
              .getSenders()
              .find(
                s =>
                  s.track &&
                  s.track.kind ===
                  "video"
              );

          if (sender) {

            await sender.replaceTrack(
              screenTrack
            );

          }

        }

        const localVideo =
          document.getElementById(
            "localVideo"
          );

        localVideo.srcObject =
          screenStream;

        screenTrack.onended =
          () => {

            if (localStream) {

              localVideo.srcObject =
                localStream;

            }

          };

        socket.emit(
          "screen-share",
          {
            receiverId:
              selectedUser.id,

            userId:
              currentUser.id
          }
        );

      } catch (error) {

        console.error(
          "Screen share error:",
          error
        );

      }

    }


    /* =====================================================
       END CALL
    ===================================================== */

    function endCall() {

      if (
        selectedUser &&
        socket
      ) {

        socket.emit(
          "end-call",
          {
            receiverId:
              selectedUser.id
          }
        );

      }

      closeCall();

    }


    function closeCall() {

      if (peerConnection) {

        peerConnection.close();

        peerConnection = null;

      }

      if (localStream) {

        localStream
          .getTracks()
          .forEach(track =>
            track.stop()
          );

        localStream = null;

      }

      document.getElementById(
        "localVideo"
      ).srcObject = null;

      document.getElementById(
        "remoteVideo"
      ).srcObject = null;

      document
        .getElementById(
          "videoPanel"
        )
        .classList.add("hidden");

    }


    /* =====================================================
       FILE UPLOAD
    ===================================================== */

    async function uploadFile() {

      const input =
        document.getElementById(
          "fileInput"
        );

      const file =
        input.files[0];

      if (!file) return;

      const formData =
        new FormData();

      formData.append(
        "file",
        file
      );

      try {

        const response =
          await fetch(
            "/api/upload",
            {
              method: "POST",
              body: formData
            }
          );

        const data =
          await response.json();

        if (!response.ok) {

          alert(
            data.error ||
            "Upload failed"
          );

          return;
        }

        if (selectedUser) {

          socket.emit(
            "private-message",
            {
              senderId:
                currentUser.id,

              receiverId:
                selectedUser.id,

              message:
                `📎 ${data.file.originalName}\n${location.origin}${data.file.url}`
            }
          );

        } else {

          alert(
            "File uploaded successfully"
          );

        }

      } catch (error) {

        console.error(error);

        alert(
          "File upload failed"
        );

      }

      input.value = "";

    }


    /* =====================================================
       LOGOUT
    ===================================================== */

    function logout() {

      closeCall();

      if (socket) {

        socket.disconnect();

        socket = null;

      }

      localStorage.removeItem(
        "rtc_user"
      );

      localStorage.removeItem(
        "rtc_token"
      );

      currentUser = null;
      selectedUser = null;

      document
        .getElementById(
          "appScreen"
        )
        .classList.add("hidden");

      document
        .getElementById(
          "authScreen"
        )
        .classList.remove("hidden");

    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHtml(text) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        String(text);

      return div.innerHTML;

    }


    /* =====================================================
       AUTO LOGIN
    ===================================================== */

    window.addEventListener(
      "load",
      () => {

        const savedUser =
          localStorage.getItem(
            "rtc_user"
          );

        if (savedUser) {

          try {

            currentUser =
              JSON.parse(
                savedUser
              );

            if (
              currentUser &&
              currentUser.id
            ) {

              openApp();

            }

          } catch (error) {

            localStorage.removeItem(
              "rtc_user"
            );

          }

        }

      }
    );


    /* =====================================================
       PWA SERVICE WORKER
    ===================================================== */

    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register(
              "/service-worker.js"
            )
            .then(() => {

              console.log(
                "Service Worker registered"
              );

            })
            .catch(error => {

              console.error(
                "Service Worker error:",
                error
              );

            });

        }
      );

    }

  </script>
