<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RealTime Communication</title>

  <script src="/socket.io/socket.io.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0910;
      color: white;
      min-height: 100vh;
    }

    button {
      cursor: pointer;
      border: none;
    }

    /* AUTH */

    #authPage {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-box {
      width: 100%;
      max-width: 400px;
      background: #17151d;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 40px #000;
    }

    .logo {
      text-align: center;
      color: #ff3b3b;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 9px;
      border: 1px solid #333;
      background: #0d0c10;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #ff3b3b;
    }

    .main-btn {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      background: #ff3b3b;
      color: white;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .main-btn:hover {
      background: #ff5555;
    }

    .message {
      min-height: 22px;
      text-align: center;
      color: #ff7777;
      margin: 8px;
    }

    hr {
      border: none;
      border-top: 1px solid #333;
      margin: 25px 0;
    }

    /* APP */

    #appPage {
      display: none;
      min-height: 100vh;
    }

    .topbar {
      height: 65px;
      background: #15131b;
      border-bottom: 1px solid #292631;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .top-logo {
      color: #ff3b3b;
      font-size: 23px;
      font-weight: bold;
    }

    .logout-btn {
      background: #292630;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
    }

    .layout {
      display: flex;
      height: calc(100vh - 65px);
    }

    /* SIDEBAR */

    .sidebar {
      width: 280px;
      background: #111016;
      border-right: 1px solid #292631;
      padding: 20px;
    }

    .profile {
      background: #1b1921;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .profile-title {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .profile-name {
      font-size: 18px;
      font-weight: bold;
    }

    .online-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      background: #2ecc71;
      border-radius: 50%;
      margin-right: 5px;
    }

    .friend-input {
      margin-top: 10px;
    }

    .connect-btn {
      width: 100%;
      padding: 12px;
      background: #33303b;
      color: white;
      border-radius: 8px;
    }

    .connect-btn:hover {
      background: #403c49;
    }

    /* CHAT */

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      padding: 15px 20px;
      background: #15131b;
      border-bottom: 1px solid #292631;
    }

    .chat-person {
      font-weight: bold;
      font-size: 18px;
    }

    #connectionStatus {
      font-size: 12px;
      color: #2ecc71;
      margin-top: 4px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .empty {
      text-align: center;
      color: #777;
      margin-top: 80px;
    }

    .message-row {
      margin-bottom: 12px;
      display: flex;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 70%;
      padding: 11px 14px;
      border-radius: 14px;
      background: #282530;
      word-wrap: break-word;
    }

    .mine .bubble {
      background: #ff3b3b;
    }

    .message-time {
      display: block;
      font-size: 10px;
      opacity: .7;
      margin-top: 4px;
    }

    .composer {
      background: #15131b;
      padding: 12px;
      display: flex;
      gap: 8px;
      border-top: 1px solid #292631;
    }

    .composer input {
      margin: 0;
      flex: 1;
    }

    .send-btn {
      width: 90px;
      background: #ff3b3b;
      color: white;
      border-radius: 8px;
    }

    /* CALL BUTTONS */

    .call-buttons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .call-btn {
      flex: 1;
      padding: 11px;
      border-radius: 8px;
      color: white;
      background: #33303b;
    }

    .call-btn:hover {
      background: #44404e;
    }

    .call-btn.video {
      background: #b52d72;
    }

    .call-btn.audio {
      background: #2764b8;
    }

    .share-btn {
      width: 100%;
      margin-top: 8px;
      padding: 11px;
      border-radius: 8px;
      background: #493b80;
      color: white;
    }

    .file-btn {
      width: 100%;
      margin-top: 8px;
      padding: 11px;
      border-radius: 8px;
      background: #2d704f;
      color: white;
    }

    #fileInput {
      display: none;
    }

    /* VIDEO */

    #callPanel {
      display: none;
      position: fixed;
      inset: 0;
      background: #050505;
      z-index: 1000;
    }

    #remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #111;
    }

    #localVideo {
      position: absolute;
      right: 20px;
      top: 20px;
      width: 220px;
      max-width: 35%;
      border-radius: 12px;
      background: #222;
      border: 2px solid white;
    }

    .call-controls {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
    }

    .call-control {
      padding: 13px 20px;
      border-radius: 30px;
      color: white;
      background: #333;
    }

    .end-call {
      background: #d62828;
    }

    #incomingCall {
      display: none;
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      background: #1c1a22;
      padding: 25px;
      border-radius: 16px;
      z-index: 2000;
      text-align: center;
      box-shadow: 0 10px 50px #000;
    }

    #incomingCall h3 {
      margin-bottom: 15px;
    }

    .incoming-buttons {
      display: flex;
      gap: 10px;
    }

    .accept-btn,
    .reject-btn {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      color: white;
    }

    .accept-btn {
      background: #27ae60;
    }

    .reject-btn {
      background: #c0392b;
    }

    @media (max-width: 700px) {

      .sidebar {
        width: 210px;
        padding: 12px;
      }

      .bubble {
        max-width: 85%;
      }

      #localVideo {
        width: 130px;
      }

      .call-buttons {
        flex-direction: column;
      }
    }

    @media (max-width: 550px) {

      .layout {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 1px solid #292631;
      }

      .profile {
        margin-bottom: 10px;
      }

      .chat-area {
        min-height: 0;
        flex: 1;
      }

      .friend-input {
        display: flex;
        gap: 5px;
      }

      .friend-input input {
        margin: 0;
      }

      .connect-btn {
        width: 100px;
      }
    }
  </style>
</head>

<body>

<!-- AUTH PAGE -->

<section id="authPage">

  <div class="auth-box">

    <div class="logo">
      RealTime
    </div>

    <div class="subtitle">
      Communication App
    </div>

    <h2>Login</h2>

    <br>

    <input
      id="loginUsername"
      type="text"
      placeholder="Username"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
    >

    <button
      class="main-btn"
      onclick="login()"
    >
      Login
    </button>

    <div
      id="loginMessage"
      class="message"
    ></div>


    <hr>


    <h2>Create Account</h2>

    <br>

    <input
      id="registerUsername"
      type="text"
      placeholder="New Username"
    >

    <input
      id="registerPassword"
      type="password"
      placeholder="New Password"
    >

    <button
      class="main-btn"
      onclick="registerUser()"
    >
      Register
    </button>

    <div
      id="registerMessage"
      class="message"
    ></div>

  </div>

</section>


<!-- APP PAGE -->

<section id="appPage">

  <header class="topbar">

    <div class="top-logo">
      RealTime
    </div>

    <button
      class="logout-btn"
      onclick="logout()"
    >
      Logout
    </button>

  </header>


  <div class="layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="profile">

        <div class="profile-title">
          Logged in as
        </div>

        <div
          id="myUsername"
          class="profile-name"
        >
          -
        </div>

        <br>

        <div>
          <span class="online-dot"></span>
          Online
        </div>

      </div>


      <h3>Connect User</h3>

      <div class="friend-input">

        <input
          id="receiverId"
          type="number"
          placeholder="Enter User ID"
        >

        <button
          class="connect-btn"
          onclick="connectUser()"
        >
          Connect
        </button>

      </div>


      <div class="call-buttons">

        <button
          class="call-btn audio"
          onclick="startAudioCall()"
        >
          🎤 Audio
        </button>

        <button
          class="call-btn video"
          onclick="startVideoCall()"
        >
          📹 Video
        </button>

      </div>


      <button
        class="share-btn"
        onclick="startScreenShare()"
      >
        🖥️ Share Screen
      </button>


      <label
        class="file-btn"
        style="display:block;text-align:center"
      >
        📁 Send File

        <input
          id="fileInput"
          type="file"
          onchange="uploadFile()"
        >

      </label>

    </aside>


    <!-- CHAT -->

    <main class="chat-area">

      <div class="chat-header">

        <div
          id="chatPerson"
          class="chat-person"
        >
          Select a user
        </div>

        <div
          id="connectionStatus"
        >
          Not connected
        </div>

      </div>


      <div
        id="messages"
        class="messages"
      >

        <div class="empty">
          Connect with a user to start chatting
        </div>

      </div>


      <div class="composer">

        <input
          id="messageInput"
          type="text"
          placeholder="Type a message..."
          onkeydown="handleEnter(event)"
        >

        <button
          class="send-btn"
          onclick="sendMessage()"
        >
          Send
        </button>

      </div>

    </main>

  </div>

</section>


<!-- CALL PANEL -->

<div id="callPanel">

  <video
    id="remoteVideo"
    autoplay
    playsinline
  ></video>

  <video
    id="localVideo"
    autoplay
    muted
    playsinline
  ></video>

  <div class="call-controls">

    <button
      class="call-control"
      onclick="toggleMute()"
    >
      🎤 Mute
    </button>

    <button
      class="call-control"
      onclick="toggleCamera()"
    >
      📹 Camera
    </button>

    <button
      class="call-control end-call"
      onclick="endCall()"
    >
      ☎ End
    </button>

  </div>

</div>


<!-- INCOMING CALL -->

<div id="incomingCall">

  <h3 id="incomingTitle">
    Incoming Call
  </h3>

  <div class="incoming-buttons">

    <button
      class="accept-btn"
      onclick="acceptCall()"
    >
      Accept
    </button>

    <button
      class="reject-btn"
      onclick="rejectCall()"
    >
      Reject
    </button>

  </div>

</div>


<script>

let socket;

let currentUser = null;

let currentReceiverId = null;

let peerConnection = null;

let localStream = null;

let incomingCallData = null;

let currentCallType = "video";

let iceServers = {
  iceServers: [
    {
      urls: "stun:stun.l.google.com:19302"
    }
  ]
};


/* =========================
   LOGIN
========================= */

async function login() {

  const username =
    document.getElementById("loginUsername").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("loginMessage");

  message.textContent = "";

  try {

    const response = await fetch("/api/login", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        username,
        password
      })

    });

    const data = await response.json();

    if (!response.ok) {
      message.textContent =
        data.error || "Login failed";
      return;
    }

    localStorage.setItem(
      "token",
      data.token
    );

    currentUser = data.user;

    openApp();

  } catch (error) {

    message.textContent =
      "Server connection failed";

  }
}


/* =========================
   REGISTER
========================= */

async function registerUser() {

  const username =
    document.getElementById("registerUsername").value.trim();

  const password =
    document.getElementById("registerPassword").value;

  const message =
    document.getElementById("registerMessage");

  message.textContent = "";

  try {

    const response = await fetch(
      "/api/register",
      {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          username,
          password
        })

      }
    );

    const data = await response.json();

    if (!response.ok) {

      message.textContent =
        data.error || "Registration failed";

      return;
    }

    localStorage.setItem(
      "token",
      data.token
    );

    currentUser = data.user;

    openApp();

  } catch (error) {

    message.textContent =
      "Server connection failed";

  }
}


/* =========================
   OPEN APP
========================= */

function openApp() {

  document.getElementById(
    "authPage"
  ).style.display = "none";

  document.getElementById(
    "appPage"
  ).style.display = "block";

  document.getElementById(
    "myUsername"
  ).textContent =
    currentUser.username +
    " (ID: " +
    currentUser.id +
    ")";

  connectSocket();
}


/* =========================
   SOCKET
========================= */

function connectSocket() {

  socket = io();

  socket.on("connect", () => {

    socket.emit(
      "user-online",
      currentUser
    );

  });


  socket.on(
    "online-users",
    users => {

      if (
        currentReceiverId &&
        users.includes(
          String(currentReceiverId)
        )
      ) {

        document.getElementById(
          "connectionStatus"
        ).textContent =
          "● User is online";

      }

    }
  );


  socket.on(
    "private-message",
    message => {

      displayMessage(message);

    }
  );


  socket.on(
    "incoming-call",
    data => {

      incomingCallData = data;

      document.getElementById(
        "incomingTitle"
      ).textContent =
        "Incoming " +
        (data.callType === "audio"
          ? "Audio"
          : "Video") +
        " Call";

      document.getElementById(
        "incomingCall"
      ).style.display = "block";

    }
  );


  socket.on(
    "call-offer",
    async data => {

      incomingCallData = data;

      await preparePeerConnection();

      await peerConnection.setRemoteDescription(
        new RTCSessionDescription(
          data.offer
        )
      );

    }
  );


  socket.on(
    "call-answer",
    async data => {

      if (!peerConnection) return;

      await peerConnection.setRemoteDescription(
        new RTCSessionDescription(
          data.answer
        )
      );

    }
  );


  socket.on(
    "ice-candidate",
    async data => {

      if (!peerConnection) return;

      try {

        await peerConnection.addIceCandidate(
          new RTCIceCandidate(
            data.candidate
          )
        );

      } catch (error) {

        console.log(
          "ICE candidate error",
          error
        );

      }

    }
  );


  socket.on(
    "end-call",
    () => {

      closeCall();

    }
  );

}


/* =========================
   CONNECT USER
========================= */

function connectUser() {

  const id =
    document.getElementById(
      "receiverId"
    ).value;

  if (!id) {

    alert("Enter User ID");

    return;

  }

  if (
    currentUser &&
    String(id) === String(currentUser.id)
  ) {

    alert("You cannot call yourself");

    return;

  }

  currentReceiverId = Number(id);

  document.getElementById(
    "chatPerson"
  ).textContent =
    "User ID: " +
    currentReceiverId;

  document.getElementById(
    "connectionStatus"
  ).textContent =
    "Connected to chat";

  document.getElementById(
    "messages"
  ).innerHTML = "";

}


/* =========================
   CHAT
========================= */

function sendMessage() {

  const input =
    document.getElementById(
      "messageInput"
    );

  const message =
    input.value.trim();

  if (!message) return;

  if (!currentReceiverId) {

    alert("Connect to a user first");

    return;

  }

  socket.emit(
    "private-message",
    {

      senderId:
        currentUser.id,

      receiverId:
        currentReceiverId,

      message

    }
  );

  input.value = "";

}


function handleEnter(event) {

  if (event.key === "Enter") {

    sendMessage();

  }

}


function displayMessage(message) {

  const container =
    document.getElementById(
      "messages"
    );

  const row =
    document.createElement(
      "div"
    );

  const mine =
    String(message.sender_id) ===
    String(currentUser.id);

  row.className =
    "message-row " +
    (mine ? "mine" : "");

  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";

  bubble.textContent =
    message.message;

  const time =
    document.createElement(
      "span"
    );

  time.className =
    "message-time";

  time.textContent =
    new Date(
      message.created_at
    ).toLocaleTimeString();

  bubble.appendChild(time);

  row.appendChild(bubble);

  container.appendChild(row);

  container.scrollTop =
    container.scrollHeight;

}


/* =========================
   WEBRTC
========================= */

async function preparePeerConnection() {

  peerConnection =
    new RTCPeerConnection(
      iceServers
    );


  peerConnection.onicecandidate =
    event => {

      if (
        event.candidate &&
        currentReceiverId
      ) {

        socket.emit(
          "ice-candidate",
          {

            receiverId:
              currentReceiverId,

            candidate:
              event.candidate

          }
        );

      }

    };


  peerConnection.ontrack =
    event => {

      document.getElementById(
        "remoteVideo"
      ).srcObject =
        event.streams[0];

    };


  if (localStream) {

    localStream
      .getTracks()
      .forEach(
        track => {

          peerConnection.addTrack(
            track,
            localStream
          );

        }
      );

  }

}


/* =========================
   AUDIO CALL
========================= */

async function startAudioCall() {

  if (!currentReceiverId) {

    alert("Connect to a user first");

    return;

  }

  currentCallType = "audio";

  await startCall();

}


/* =========================
   VIDEO CALL
========================= */

async function startVideoCall() {

  if (!currentReceiverId) {

    alert("Connect to a user first");

    return;

  }

  currentCallType = "video";

  await startCall();

}


/* =========================
   START CALL
========================= */

async function startCall() {

  try {

    localStream =
      await navigator.mediaDevices.getUserMedia(
        {
          audio: true,
          video:
            currentCallType === "video"
        }
      );


    document.getElementById(
      "localVideo"
    ).srcObject =
      localStream;


    if (
      currentCallType === "audio"
    ) {

      document.getElementById(
        "localVideo"
      ).style.display =
        "none";

      document.getElementById(
        "remoteVideo"
      ).style.background =
        "#111";

    } else {

      document.getElementById(
        "localVideo"
      ).style.display =
        "block";

    }


    document.getElementById(
      "callPanel"
    ).style.display =
      "block";


    await preparePeerConnection();


    const offer =
      await peerConnection.createOffer();

    await peerConnection.setLocalDescription(
      offer
    );


    socket.emit(
      "call-offer",
      {

        senderId:
          currentUser.id,

        receiverId:
          currentReceiverId,

        callType:
          currentCallType,

        offer

      }
    );


    socket.emit(
      "start-call",
      {

        senderId:
          currentUser.id,

        receiverId:
          currentReceiverId,

        callType:
          currentCallType

      }
    );

  } catch (error) {

    console.error(error);

    alert(
      "Camera/microphone permission required"
    );

  }

}


/* =========================
   ACCEPT CALL
========================= */

async function acceptCall() {

  document.getElementById(
    "incomingCall"
  ).style.display =
    "none";


  if (!incomingCallData) return;


  currentReceiverId =
    Number(
      incomingCallData.senderId
    );


  currentCallType =
    incomingCallData.callType ||
    "video";


  try {

    localStream =
      await navigator.mediaDevices.getUserMedia(
        {
          audio: true,
          video:
            currentCallType === "video"
        }
      );


    document.getElementById(
      "localVideo"
    ).srcObject =
      localStream;


    document.getElementById(
      "localVideo"
    ).style.display =
      currentCallType === "video"
        ? "block"
        : "none";


    document.getElementById(
      "callPanel"
    ).style.display =
      "block";


    if (!peerConnection) {

      await preparePeerConnection();

    }


    const answer =
      await peerConnection.createAnswer();


    await peerConnection.setLocalDescription(
      answer
    );


    socket.emit(
      "call-answer",
      {

        senderId:
          currentUser.id,

        receiverId:
          currentReceiverId,

        answer

      }
    );

  } catch (error) {

    console.error(error);

    alert(
      "Camera/microphone permission required"
    );

  }

}


/* =========================
   REJECT
========================= */

function rejectCall() {

  document.getElementById(
    "incomingCall"
  ).style.display =
    "none";

  incomingCallData = null;

}


/* =========================
   MUTE
========================= */

function toggleMute() {

  if (!localStream) return;

  const audioTracks =
    localStream.getAudioTracks();

  audioTracks.forEach(
    track => {

      track.enabled =
        !track.enabled;

    }
  );

}


/* =========================
   CAMERA
========================= */

function toggleCamera() {

  if (!localStream) return;

  const videoTracks =
    localStream.getVideoTracks();

  videoTracks.forEach(
    track => {

      track.enabled =
        !track.enabled;

    }
  );

}


/* =========================
   SCREEN SHARE
========================= */

async function startScreenShare() {

  if (!peerConnection) {

    alert(
      "Start a video call first"
    );

    return;

  }

  try {

    const screenStream =
      await navigator.mediaDevices.getDisplayMedia(
        {
          video: true
        }
      );


    const screenTrack =
      screenStream.getVideoTracks()[0];


    const sender =
      peerConnection
        .getSenders()
        .find(
          s =>
            s.track &&
            s.track.kind === "video"
        );


    if (sender) {

      await sender.replaceTrack(
        screenTrack
      );

    }


    screenTrack.onended =
      async () => {

        if (localStream) {

          const cameraTrack =
            localStream.getVideoTracks()[0];

          if (cameraTrack) {

            await sender.replaceTrack(
              cameraTrack
            );

          }

        }

      };

  } catch (error) {

    console.error(
      "Screen share error",
      error
    );

  }

}


/* =========================
   FILE UPLOAD
========================= */

async function uploadFile() {

  const input =
    document.getElementById(
      "fileInput"
    );

  const file =
    input.files[0];

  if (!file) return;

  if (!currentReceiverId) {

    alert("Connect to a user first");

    input.value = "";

    return;

  }


  const formData =
    new FormData();

  formData.append(
    "file",
    file
  );


  try {

    const response =
      await fetch(
        "/api/upload",
        {
          method: "POST",
          body: formData
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      alert(
        data.error ||
        "Upload failed"
      );

      return;

    }


    socket.emit(
      "private-message",
      {

        senderId:
          currentUser.id,

        receiverId:
          currentReceiverId,

        message:
          "📁 File: " +
          data.file.originalName +
          "\n" +
          window.location.origin +
          data.file.url

      }
    );


    alert("File sent");

  } catch (error) {

    alert(
      "File upload failed"
    );

  }

  input.value = "";

}


/* =========================
   END CALL
========================= */

function endCall() {

  if (currentReceiverId) {

    socket.emit(
      "end-call",
      {
        receiverId:
          currentReceiverId
      }
    );

  }

  closeCall();

}


function closeCall() {

  if (localStream) {

    localStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  if (peerConnection) {

    peerConnection.close();

  }


  peerConnection = null;

  localStream = null;

  document.getElementById(
    "localVideo"
  ).srcObject = null;

  document.getElementById(
    "remoteVideo"
  ).srcObject = null;

  document.getElementById(
    "callPanel"
  ).style.display =
    "none";

}


/* =========================
   LOGOUT
========================= */

function logout() {

  if (socket) {

    socket.disconnect();

  }

  closeCall();

  localStorage.removeItem(
    "token"
  );

  location.reload();

}

</script>
