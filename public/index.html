<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MovieStream</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #09090d;
      color: white;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* AUTH */

    .auth-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #09090d, #1b1020);
    }

    .auth-box {
      width: 100%;
      max-width: 400px;
      background: #15151c;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 40px #000;
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #ff3d3d;
      margin-bottom: 8px;
    }

    .tagline {
      text-align: center;
      color: #999;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0c0c11;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #ff3d3d;
    }

    .main-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #ff3d3d;
      color: white;
      font-size: 15px;
      font-weight: bold;
    }

    .main-btn:hover {
      background: #e52d2d;
    }

    .switch {
      text-align: center;
      color: #999;
      margin-top: 18px;
    }

    .switch span {
      color: #ff4b4b;
      cursor: pointer;
      font-weight: bold;
    }

    .message {
      min-height: 22px;
      margin-top: 12px;
      text-align: center;
      color: #ff7777;
    }

    /* APP */

    header {
      height: 65px;
      padding: 0 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #15151c;
      border-bottom: 1px solid #292933;
    }

    .header-logo {
      color: #ff3d3d;
      font-size: 23px;
      font-weight: bold;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .username {
      color: #ddd;
    }

    .logout {
      padding: 9px 14px;
      border: none;
      border-radius: 7px;
      background: #d83232;
      color: white;
    }

    main {
      max-width: 1300px;
      margin: auto;
      padding: 25px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      margin-bottom: 8px;
    }

    .welcome p {
      color: #999;
    }

    .search {
      max-width: 500px;
      margin-bottom: 25px;
    }

    .movies {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 20px;
    }

    .movie {
      overflow: hidden;
      background: #15151c;
      border: 1px solid #292933;
      border-radius: 12px;
    }

    .movie img {
      width: 100%;
      height: 270px;
      object-fit: cover;
      background: #222;
    }

    .movie-info {
      padding: 14px;
    }

    .movie-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .movie-description {
      color: #999;
      font-size: 14px;
      min-height: 38px;
      margin-bottom: 12px;
    }

    .watch {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 7px;
      background: #ff3d3d;
      color: white;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 40px;
    }

    /* VIDEO */

    .player-box {
      margin-top: 30px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    .player-box video {
      display: block;
      width: 100%;
      max-height: 600px;
    }

    .player-title {
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      header {
        padding: 0 12px;
      }

      .username {
        display: none;
      }

      main {
        padding: 15px;
      }

      .movies {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .movie img {
        height: 210px;
      }

      .movie-info {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- ================= LOGIN / REGISTER ================= -->

  <section id="authPage" class="auth-page">

    <div class="auth-box">

      <div class="logo">MovieStream</div>

      <div class="tagline">
        Watch your favourite movies
      </div>


      <!-- LOGIN -->

      <div id="loginBox">

        <input
          id="loginUsername"
          type="text"
          placeholder="Username"
          autocomplete="username"
        >

        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
        >

        <button
          class="main-btn"
          onclick="login()"
        >
          Login
        </button>

        <div
          id="loginMessage"
          class="message"
        ></div>

        <div class="switch">
          Don't have an account?
          <span onclick="showRegister()">
            Create Account
          </span>
        </div>

      </div>


      <!-- REGISTER -->

      <div id="registerBox" class="hidden">

        <input
          id="registerUsername"
          type="text"
          placeholder="Choose username"
          autocomplete="username"
        >

        <input
          id="registerPassword"
          type="password"
          placeholder="Choose password"
          autocomplete="new-password"
        >

        <button
          class="main-btn"
          onclick="registerUser()"
        >
          Create Account
        </button>

        <div
          id="registerMessage"
          class="message"
        ></div>

        <div class="switch">
          Already have an account?
          <span onclick="showLogin()">
            Login
          </span>
        </div>

      </div>

    </div>

  </section>


  <!-- ================= MAIN APP ================= -->

  <section id="appPage" class="hidden">

    <header>

      <div class="header-logo">
        MovieStream
      </div>

      <div class="user-area">

        <span
          id="username"
          class="username"
        ></span>

        <button
          class="logout"
          onclick="logout()"
        >
          Logout
        </button>

      </div>

    </header>


    <main>

      <div class="welcome">

        <h1>
          Welcome to MovieStream 🎬
        </h1>

        <p>
          Enjoy your movies.
        </p>

      </div>


      <div class="search">

        <input
          id="searchInput"
          type="text"
          placeholder="Search movies..."
          oninput="searchMovies()"
        >

      </div>


      <div
        id="movies"
        class="movies"
      ></div>


      <div
        id="empty"
        class="empty hidden"
      >
        No movies found.
      </div>


      <!-- VIDEO PLAYER -->

      <div
        id="playerBox"
        class="player-box hidden"
      >

        <video
          id="player"
          controls
        ></video>

        <div
          id="playerTitle"
          class="player-title"
        ></div>

      </div>

    </main>

  </section>


<script>

/* =====================================================
   MOVIESTREAM APP
   ===================================================== */

let token = localStorage.getItem("movieToken");
let currentUser = null;
let moviesList = [];


/* ================= API ================= */

async function api(url, options = {}) {

  const headers = {
    "Content-Type": "application/json"
  };

  if (token) {
    headers.Authorization =
      "Bearer " + token;
  }

  const response = await fetch(url, {
    ...options,
    headers
  });

  let data = {};

  try {
    data = await response.json();
  } catch {
    data = {};
  }

  if (!response.ok) {
    throw new Error(
      data.error || "Request failed"
    );
  }

  return data;
}


/* ================= SHOW LOGIN ================= */

function showLogin() {

  document
    .getElementById("loginBox")
    .classList.remove("hidden");

  document
    .getElementById("registerBox")
    .classList.add("hidden");

  document
    .getElementById("loginMessage")
    .textContent = "";

  document
    .getElementById("registerMessage")
    .textContent = "";
}


/* ================= SHOW REGISTER ================= */

function showRegister() {

  document
    .getElementById("loginBox")
    .classList.add("hidden");

  document
    .getElementById("registerBox")
    .classList.remove("hidden");

  document
    .getElementById("loginMessage")
    .textContent = "";

  document
    .getElementById("registerMessage")
    .textContent = "";
}


/* ================= REGISTER ================= */

async function registerUser() {

  const username =
    document
      .getElementById("registerUsername")
      .value
      .trim();

  const password =
    document
      .getElementById("registerPassword")
      .value;

  const message =
    document.getElementById(
      "registerMessage"
    );

  message.textContent = "";

  if (!username || !password) {

    message.textContent =
      "Enter username and password.";

    return;
  }

  if (password.length < 6) {

    message.textContent =
      "Password must be at least 6 characters.";

    return;
  }

  try {

    const data = await api(
      "/api/register",
      {
        method: "POST",
        body: JSON.stringify({
          username: username,
          password: password
        })
      }
    );

    token = data.token;

    localStorage.setItem(
      "movieToken",
      token
    );

    currentUser = data.user;

    openApp();

  } catch (error) {

    message.textContent =
      error.message;

  }
}


/* ================= LOGIN ================= */

async function login() {

  const username =
    document
      .getElementById("loginUsername")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  const message =
    document.getElementById(
      "loginMessage"
    );

  message.textContent = "";

  if (!username || !password) {

    message.textContent =
      "Enter username and password.";

    return;
  }

  try {

    const data = await api(
      "/api/login",
      {
        method: "POST",
        body: JSON.stringify({
          username: username,
          password: password
        })
      }
    );

    token = data.token;

    localStorage.setItem(
      "movieToken",
      token
    );

    currentUser = data.user;

    openApp();

  } catch (error) {

    message.textContent =
      error.message;

  }
}


/* ================= SESSION ================= */

async function checkSession() {

  if (!token) {
    return;
  }

  try {

    const data =
      await api("/api/me");

    currentUser = data.user;

    openApp();

  } catch {

    localStorage.removeItem(
      "movieToken"
    );

    token = null;

  }
}


/* ================= OPEN APP ================= */

function openApp() {

  document
    .getElementById("authPage")
    .classList.add("hidden");

  document
    .getElementById("appPage")
    .classList.remove("hidden");

  document
    .getElementById("username")
    .textContent =
      currentUser?.username || "";

  loadMovies();
}


/* ================= LOGOUT ================= */

function logout() {

  localStorage.removeItem(
    "movieToken"
  );

  token = null;
  currentUser = null;

  document
    .getElementById("appPage")
    .classList.add("hidden");

  document
    .getElementById("authPage")
    .classList.remove("hidden");

  showLogin();
}


/* ================= LOAD MOVIES ================= */

async function loadMovies() {

  const container =
    document.getElementById("movies");

  container.innerHTML =
    "<div class='empty'>Loading...</div>";

  try {

    /*
      Current server returns
      { movies: [...] }
    */

    const data =
      await api("/api/movies");

    moviesList =
      data.movies || [];

    renderMovies(moviesList);

  } catch (error) {

    container.innerHTML =
      `<div class="empty">
        ${escapeHtml(error.message)}
      </div>`;

  }
}


/* ================= RENDER MOVIES ================= */

function renderMovies(list) {

  const container =
    document.getElementById("movies");

  const empty =
    document.getElementById("empty");

  container.innerHTML = "";

  if (!list.length) {

    empty.classList.remove(
      "hidden"
    );

    return;
  }

  empty.classList.add("hidden");

  list.forEach(movie => {

    const card =
      document.createElement("div");

    card.className = "movie";

    const image =
      movie.thumbnail_url ||
      "https://via.placeholder.com/500x700?text=Movie";

    card.innerHTML = `

      <img
        src="${escapeAttribute(image)}"
        alt="${escapeAttribute(movie.title)}"
        onerror="this.src='https://via.placeholder.com/500x700?text=Movie'"
      >

      <div class="movie-info">

        <div class="movie-title">
          ${escapeHtml(movie.title)}
        </div>

        <div class="movie-description">
          ${escapeHtml(movie.description || "")}
        </div>

        <button
          class="watch"
          onclick="watchMovie(${movie.id})"
        >
          ▶ Watch
        </button>

      </div>

    `;

    container.appendChild(card);

  });
}


/* ================= WATCH ================= */

async function watchMovie(id) {

  try {

    const data =
      await api(
        `/api/movies/${id}/watch`
      );

    const movie =
      data.movie;

    document
      .getElementById("player")
      .src = movie.videoUrl;

    document
      .getElementById("playerTitle")
      .textContent = movie.title;

    document
      .getElementById("playerBox")
      .classList.remove("hidden");

    document
      .getElementById("playerBox")
      .scrollIntoView({
        behavior: "smooth"
      });

  } catch (error) {

    alert(error.message);

  }
}


/* ================= SEARCH ================= */

function searchMovies() {

  const query =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();

  const filtered =
    moviesList.filter(movie =>
      movie.title
        .toLowerCase()
        .includes(query)
    );

  renderMovies(filtered);
}


/* ================= SECURITY ================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function escapeAttribute(value) {

  return escapeHtml(value);
}


/* ================= START ================= */

checkSession();

</script>

</body>
</html>
