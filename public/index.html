<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>RealTimeChat</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#111111">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:white;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* ================= AUTH ================= */

#authScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#101010;
}

.authBox{
  width:100%;
  max-width:420px;
  background:#1d1d1d;
  padding:30px;
  border-radius:18px;
  box-shadow:0 15px 50px rgba(0,0,0,.5);
}

.authBox h1{
  text-align:center;
  margin-top:0;
}

.authBox h2{
  margin-bottom:8px;
}

.authBox input{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #444;
  border-radius:9px;
  background:#292929;
  color:white;
  outline:none;
}

.authBox button{
  border:0;
  border-radius:9px;
  padding:13px;
}

.primaryBtn{
  background:#2563eb;
  color:white;
}

.secondaryBtn{
  background:#333;
  color:white;
}

.authButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

#authMessage{
  text-align:center;
  min-height:20px;
  margin-top:15px;
}

/* ================= APP ================= */

#appScreen{
  height:100vh;
  display:flex;
  overflow:hidden;
}

/* ================= SIDEBAR ================= */

.sidebar{
  width:320px;
  background:#181818;
  border-right:1px solid #333;
  padding:16px;
  overflow-y:auto;
}

.logo{
  font-size:24px;
  font-weight:bold;
  margin-bottom:18px;
}

.profile{
  background:#242424;
  padding:14px;
  border-radius:12px;
  margin-bottom:12px;
}

.profileName{
  font-size:18px;
  font-weight:bold;
}

.userId{
  color:#999;
  font-size:13px;
  margin-top:4px;
}

.searchBox input,
.connectBox input{
  width:100%;
  padding:11px;
  margin-bottom:7px;
  border:1px solid #444;
  border-radius:8px;
  background:#292929;
  color:white;
  outline:none;
}

.connectBtn,
.searchBtn{
  width:100%;
  padding:11px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
}

.sectionTitle{
  font-weight:bold;
  margin:18px 0 9px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.badge{
  background:#ef4444;
  color:white;
  min-width:22px;
  height:22px;
  padding:2px 6px;
  border-radius:20px;
  font-size:12px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}

.userItem,
.friendItem,
.requestItem{
  background:#242424;
  padding:11px;
  border-radius:9px;
  margin-bottom:7px;
}

.userItem{
  cursor:pointer;
}

.userItem:hover,
.friendItem:hover{
  background:#303030;
}

.onlineDot,
.offlineDot{
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:50%;
  margin-right:7px;
}

.onlineDot{
  background:#22c55e;
}

.offlineDot{
  background:#777;
}

.itemButtons{
  display:flex;
  gap:5px;
  margin-top:8px;
}

.smallBtn{
  border:0;
  border-radius:7px;
  padding:7px 9px;
  color:white;
  font-size:12px;
}

.addBtn{
  background:#2563eb;
}

.acceptBtn{
  background:#16a34a;
}

.rejectBtn{
  background:#dc2626;
}

.chatFriendBtn{
  background:#7c3aed;
}

.emptySide{
  color:#777;
  font-size:13px;
  padding:8px 2px;
}

.logoutBtn{
  width:100%;
  margin-top:20px;
  padding:11px;
  border:0;
  border-radius:8px;
  background:#7f1d1d;
  color:white;
}

/* ================= CHAT ================= */

.chatArea{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.chatHeader{
  min-height:70px;
  padding:12px 18px;
  background:#181818;
  border-bottom:1px solid #333;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.chatUserName{
  font-size:19px;
  font-weight:bold;
}

.callButtons{
  display:flex;
  gap:7px;
}

.callBtn{
  border:0;
  border-radius:8px;
  padding:10px 13px;
  color:white;
}

.audioBtn{
  background:#16a34a;
}

.videoBtn{
  background:#2563eb;
}

.screenBtn{
  background:#7c3aed;
}

#messages{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:9px;
  background:#101010;
}

.message{
  max-width:75%;
  padding:10px 13px;
  border-radius:13px;
  word-break:break-word;
}

.mine{
  align-self:flex-end;
  background:#2563eb;
}

.theirs{
  align-self:flex-start;
  background:#292929;
}

.messageTime{
  font-size:10px;
  opacity:.7;
  margin-top:5px;
}

.readMark{
  margin-left:3px;
}

.messageActions{
  margin-top:5px;
}

.deleteMessage{
  border:0;
  background:transparent;
  color:#ffb4b4;
  font-size:11px;
}

.emptyChat{
  margin:auto;
  text-align:center;
  color:#777;
}

.messageBar{
  padding:10px;
  background:#181818;
  border-top:1px solid #333;
  display:flex;
  gap:7px;
}

.messageBar input{
  flex:1;
  min-width:0;
  padding:12px;
  background:#292929;
  border:1px solid #444;
  border-radius:9px;
  color:white;
}

.fileBtn,
.sendBtn{
  border:0;
  border-radius:9px;
  padding:10px 14px;
  color:white;
}

.fileBtn{
  background:#444;
}

.sendBtn{
  background:#2563eb;
}

#fileInput{
  display:none;
}

.typing{
  color:#777;
  font-size:12px;
  padding:0 20px 5px;
}

/* ================= CALL ================= */

#incomingCall{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2000;
}

.callPopup{
  width:min(90%,360px);
  background:#222;
  padding:25px;
  border-radius:18px;
  text-align:center;
}

.callPopup button{
  border:0;
  border-radius:9px;
  padding:12px 18px;
  margin:5px;
  color:white;
}

.acceptCall{
  background:#16a34a;
}

.rejectCall{
  background:#dc2626;
}

/* ================= VIDEO ================= */

#videoPanel{
  position:fixed;
  right:20px;
  bottom:20px;
  width:min(450px,90vw);
  background:#000;
  border-radius:15px;
  padding:10px;
  z-index:1500;
  box-shadow:0 10px 40px rgba(0,0,0,.6);
}

.videos{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

video{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  background:#050505;
  border-radius:10px;
}

.videoControls{
  display:flex;
  justify-content:center;
  gap:7px;
  margin-top:8px;
}

.videoControls button{
  border:0;
  border-radius:8px;
  padding:9px 12px;
  background:#333;
  color:white;
}

.endCall{
  background:#dc2626!important;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

  #appScreen{
    flex-direction:column;
  }

  .sidebar{
    width:100%;
    max-height:44vh;
    border-right:0;
    border-bottom:1px solid #333;
  }

  .chatHeader{
    flex-direction:column;
    align-items:flex-start;
  }

  .callButtons{
    width:100%;
  }

  .callBtn{
    flex:1;
  }

  .message{
    max-width:88%;
  }

  .videos{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<!-- =====================================================
     AUTH
===================================================== -->

<section id="authScreen">

  <div class="authBox">

    <h1>💬 RealTimeChat</h1>

    <h2>Login</h2>

    <input
      id="loginUsername"
      placeholder="Username"
      autocomplete="username"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      class="primaryBtn"
      style="width:100%;"
      onclick="login()"
    >
      Login
    </button>

    <hr style="border-color:#333;margin:25px 0;">

    <h2>Create Account</h2>

    <input
      id="registerUsername"
      placeholder="Choose username"
      autocomplete="username"
    >

    <input
      id="registerPassword"
      type="password"
      placeholder="Create password"
      autocomplete="new-password"
    >

    <div class="authButtons">

      <button
        class="primaryBtn"
        onclick="register()"
      >
        Register
      </button>

      <button
        class="secondaryBtn"
        onclick="clearAuth()"
      >
        Clear
      </button>

    </div>

    <div id="authMessage"></div>

  </div>

</section>


<!-- =====================================================
     APP
===================================================== -->

<section id="appScreen" class="hidden">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="logo">
      💬 RealTimeChat
    </div>

    <div class="profile">

      <div
        id="profileName"
        class="profileName"
      >
        User
      </div>

      <div
        id="profileId"
        class="userId"
      >
        ID: -
      </div>

    </div>


    <!-- SEARCH -->

    <div class="searchBox">

      <input
        id="searchInput"
        placeholder="🔍 Search username..."
        oninput="searchUsers()"
      >

    </div>


    <!-- CONNECT -->

    <div class="connectBox">

      <input
        id="connectUserId"
        type="number"
        placeholder="Enter User ID"
      >

      <button
        class="connectBtn"
        onclick="connectUser()"
      >
        Connect User
      </button>

    </div>


    <!-- FRIEND REQUESTS -->

    <div class="sectionTitle">

      <span>📩 Requests</span>

      <span
        id="requestBadge"
        class="badge hidden"
      >
        0
      </span>

    </div>

    <div id="requestsList"></div>


    <!-- FRIENDS -->

    <div class="sectionTitle">
      🤝 Friends
    </div>

    <div id="friendsList"></div>


    <!-- USERS -->

    <div class="sectionTitle">
      👥 Users
    </div>

    <div id="usersList"></div>


    <button
      class="logoutBtn"
      onclick="logout()"
    >
      Logout
    </button>

  </aside>


  <!-- CHAT -->

  <main class="chatArea">

    <header class="chatHeader">

      <div>

        <div
          id="chatUserName"
          class="chatUserName"
        >
          Select a user
        </div>

        <small
          id="chatUserStatus"
          style="color:#888;"
        >
          No conversation selected
        </small>

      </div>


      <div class="callButtons">

        <button
          class="callBtn audioBtn"
          onclick="startAudioCall()"
        >
          📞 Audio
        </button>

        <button
          class="callBtn videoBtn"
          onclick="startVideoCall()"
        >
          📹 Video
        </button>

        <button
          class="callBtn screenBtn"
          onclick="shareScreen()"
        >
          🖥️ Screen
        </button>

      </div>

    </header>


    <div
      id="typingIndicator"
      class="typing hidden"
    >
      typing...
    </div>


    <div id="messages">

      <div class="emptyChat">
        Connect with a user to start chatting.
      </div>

    </div>


    <div class="messageBar">

      <label
        class="fileBtn"
        for="fileInput"
      >
        📎
      </label>

      <input
        id="fileInput"
        type="file"
        onchange="uploadFile()"
      >

      <input
        id="messageInput"
        placeholder="Type a message..."
        oninput="typingStart()"
        onkeydown="handleMessageKey(event)"
      >

      <button
        class="sendBtn"
        onclick="sendMessage()"
      >
        Send
      </button>

    </div>

  </main>

</section>


<!-- =====================================================
     INCOMING CALL
===================================================== -->

<div
  id="incomingCall"
  class="hidden"
>

  <div class="callPopup">

    <h2>📞 Incoming Call</h2>

    <p id="callerText">
      Someone is calling...
    </p>

    <button
      class="acceptCall"
      onclick="acceptCall()"
    >
      Accept
    </button>

    <button
      class="rejectCall"
      onclick="rejectCall()"
    >
      Reject
    </button>

  </div>

</div>


<!-- =====================================================
     VIDEO PANEL
===================================================== -->

<div
  id="videoPanel"
  class="hidden"
>

  <div class="videos">

    <video
      id="localVideo"
      autoplay
      muted
      playsinline
    ></video>

    <video
      id="remoteVideo"
      autoplay
      playsinline
    ></video>

  </div>

  <div class="videoControls">

    <button onclick="toggleMute()">
      🎤 Mute
    </button>

    <button onclick="toggleCamera()">
      📷 Camera
    </button>

    <button
      class="endCall"
      onclick="endCall()"
    >
      ❌ End
    </button>

  </div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

/* =====================================================
   GLOBALS
===================================================== */

let socket = null;

let currentUser = null;
let selectedUser = null;

let allUsers = [];
let friends = [];
let requests = [];

let localStream = null;
let peerConnection = null;

let incomingCallData = null;
let pendingOffer = null;

let iceQueue = [];

let typingTimer = null;
let currentlyTyping = false;

const rtcConfig = {

  iceServers: [
    {
      urls:
        "stun:stun.l.google.com:19302"
    }
  ]

};


/* =====================================================
   TOKEN
===================================================== */

function getToken(){

  return localStorage.getItem(
    "rtc_token"
  );

}


function authHeaders(){

  const token =
    getToken();

  return token
    ? {
        Authorization:
          "Bearer " + token
      }
    : {};

}


/* =====================================================
   AUTH MESSAGE
===================================================== */

function showAuthMessage(
  message,
  success=false
){

  const box =
    document.getElementById(
      "authMessage"
    );

  box.textContent =
    message;

  box.style.color =
    success
      ? "#22c55e"
      : "#ef4444";

}


function clearAuth(){

  document.getElementById(
    "loginUsername"
  ).value="";

  document.getElementById(
    "loginPassword"
  ).value="";

  document.getElementById(
    "registerUsername"
  ).value="";

  document.getElementById(
    "registerPassword"
  ).value="";

  showAuthMessage("");

}


/* =====================================================
   REGISTER
===================================================== */

async function register(){

  const username =
    document.getElementById(
      "registerUsername"
    ).value.trim();

  const password =
    document.getElementById(
      "registerPassword"
    ).value;

  if(
    username.length < 3 ||
    password.length < 6
  ){

    showAuthMessage(
      "Username: 3+ characters, Password: 6+ characters"
    );

    return;
  }

  try{

    showAuthMessage(
      "Creating account..."
    );

    const response =
      await fetch(
        "/api/register",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            username,
            password
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      showAuthMessage(
        data.error ||
        "Registration failed"
      );

      return;
    }

    showAuthMessage(
      "Account created. Please login.",
      true
    );

    document.getElementById(
      "loginUsername"
    ).value=username;

    document.getElementById(
      "loginPassword"
    ).value=password;

  }catch(error){

    console.error(error);

    showAuthMessage(
      "Server connection failed"
    );

  }

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const username =
    document.getElementById(
      "loginUsername"
    ).value.trim();

  const password =
    document.getElementById(
      "loginPassword"
    ).value;

  if(!username || !password){

    showAuthMessage(
      "Enter username and password"
    );

    return;
  }

  try{

    showAuthMessage(
      "Logging in..."
    );

    const response =
      await fetch(
        "/api/login",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            username,
            password
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      showAuthMessage(
        data.error ||
        "Login failed"
      );

      return;
    }

    localStorage.setItem(
      "rtc_token",
      data.token
    );

    localStorage.setItem(
      "rtc_user",
      JSON.stringify(
        data.user
      )
    );

    currentUser =
      data.user;

    openApp();

  }catch(error){

    console.error(error);

    showAuthMessage(
      "Server connection failed"
    );

  }

}


/* =====================================================
   OPEN APP
===================================================== */

function openApp(){

  if(!currentUser)
    return;

  document
    .getElementById(
      "authScreen"
    )
    .classList.add(
      "hidden"
    );

  document
    .getElementById(
      "appScreen"
    )
    .classList.remove(
      "hidden"
    );

  document.getElementById(
    "profileName"
  ).textContent =
    currentUser.username;

  document.getElementById(
    "profileId"
  ).textContent =
    "ID: " +
    currentUser.id;

  connectSocket();

  loadUsers();

  loadFriends();

  loadRequests();

}


/* =====================================================
   SOCKET
===================================================== */

function connectSocket(){

  if(socket)
    return;

  socket =
    io({
      transports:[
        "websocket",
        "polling"
      ]
    });


  socket.on(
    "connect",
    ()=>{
      
      socket.emit(
        "user-online",
        currentUser
      );

    }
  );


  socket.on(
    "online-users",
    ()=>{
      loadUsers();
      loadFriends();
    }
  );


  socket.on(
    "private-message",
    message=>{

      if(
        selectedUser &&
        (
          (
            Number(message.sender_id) ===
            Number(currentUser.id) &&
            Number(message.receiver_id) ===
            Number(selectedUser.id)
          )
          ||
          (
            Number(message.sender_id) ===
            Number(selectedUser.id) &&
            Number(message.receiver_id) ===
            Number(currentUser.id)
          )
        )
      ){

        displayMessage(
          message
        );

      }

    }
  );


  socket.on(
    "message-deleted",
    ()=>{
      loadChatHistory();
    }
  );


  socket.on(
    "message-error",
    data=>{

      alert(
        data.error ||
        "Message failed"
      );

    }
  );


  socket.on(
    "messages-read",
    ()=>{
      document
        .querySelectorAll(
          ".readMark"
        )
        .forEach(
          mark=>{
            mark.textContent="✓✓";
          }
        );
    }
  );


  socket.on(
    "typing",
    data=>{

      if(
        selectedUser &&
        Number(
          data.senderId
        ) ===
        Number(
          selectedUser.id
        )
      ){

        document
          .getElementById(
            "typingIndicator"
          )
          .classList.toggle(
            "hidden",
            !data.typing
          );

      }

    }
  );


  socket.on(
    "friend-request",
    ()=>{

      loadRequests();

      alert(
        "📩 New friend request"
      );

    }
  );


  socket.on(
    "friend-accepted",
    ()=>{

      loadFriends();

      loadUsers();

    }
  );


  /* CALL */

  socket.on(
    "incoming-call",
    data=>{

      incomingCallData =
        data;

      document.getElementById(
        "callerText"
      ).textContent =
        (
          data.callerName ||
          "Someone"
        ) +
        " is calling (" +
        (
          data.callType ||
          "audio"
        ) +
        ")";

      document
        .getElementById(
          "incomingCall"
        )
        .classList.remove(
          "hidden"
        );

    }
  );


  socket.on(
    "call-offer",
    async data=>{

      pendingOffer =
        data.offer;

      incomingCallData =
        {
          ...(incomingCallData || {}),
          ...data
        };

      if(
        peerConnection &&
        selectedUser &&
        Number(
          selectedUser.id
        ) ===
        Number(
          data.callerId
        )
      ){

        await acceptRemoteOffer(
          data
        );

      }

    }
  );


  socket.on(
    "call-answer",
    async data=>{

      if(!peerConnection)
        return;

      try{

        await peerConnection
          .setRemoteDescription(
            new RTCSessionDescription(
              data.answer
            )
          );

        await flushIce();

      }catch(error){

        console.error(
          "Answer error:",
          error
        );

      }

    }
  );


  socket.on(
    "ice-candidate",
    async data=>{

      if(!data.candidate)
        return;

      if(
        peerConnection &&
        peerConnection.remoteDescription
      ){

        try{

          await peerConnection
            .addIceCandidate(
              new RTCIceCandidate(
                data.candidate
              )
            );

        }catch(error){

          console.error(
            error
          );

        }

      }else{

        iceQueue.push(
          data.candidate
        );

      }

    }
  );


  socket.on(
    "end-call",
    ()=>{
      closeCall();
    }
  );


  socket.on(
    "call-error",
    data=>{

      alert(

/* =====================================================
   DISPLAY MESSAGE
===================================================== */

function displayMessage(
  message
){

  const box =
    document.getElementById(
      "messages"
    );

  const empty =
    box.querySelector(
      ".emptyChat"
    );

  if(empty)
    empty.remove();

  const div =
    document.createElement(
      "div"
    );

  const mine =
    Number(
      message.sender_id
    ) ===
    Number(
      currentUser.id
    );

  div.className =
    "message " +
    (
      mine
        ? "mine"
        : "theirs"
    );

  let content="";

  if(
    message.is_deleted
  ){

    content =
      `<div style="opacity:.6;">
        Message deleted
      </div>`;

  }else if(
    message.message_type==="file" &&
    message.file_url
  ){

    content = `
      📎
      <a
        href="${escapeAttribute(
          message.file_url
        )}"
        target="_blank"
        rel="noopener"
        style="
          color:white;
          text-decoration:underline;
        "
      >
        ${escapeHtml(
          message.file_name ||
          "File"
        )}
      </a>
    `;

  }else{

    content =
      `<div style="white-space:pre-wrap;">
        ${escapeHtml(
          message.message || ""
        )}
      </div>`;

  }

  const time =
    message.created_at
      ? new Date(
          message.created_at
        ).toLocaleTimeString(
          [],
          {
            hour:"2-digit",
            minute:"2-digit"
          }
        )
      : "";

  const read =
    mine
      ? (
        message.is_read
          ? "✓✓"
          : "✓"
      )
      : "";

  div.innerHTML = `
    ${content}

    <div class="messageTime">
      ${time}

      <span class="readMark">
        ${read}
      </span>

      ${
        mine &&
        message.id &&
        !message.is_deleted
          ? `
            <button
              class="deleteMessage"
              onclick="
                deleteMessage(${message.id})
              "
            >
              Delete
            </button>
          `
          : ""
      }

    </div>
  `;

  box.appendChild(
    div
  );

  scrollMessages();

}

async function uploadFile(){

  const input =
    document.getElementById(
      "fileInput"
    );

    input.files[0];

  if(!file)
    return;

  if(!selectedUser){

    alert(
      "Select a user first"
    );

    input.value="";

    return;
  }

  if(
    file.size >
    100 * 1024 * 1024
  ){

    alert(
      "Maximum file size is 100 MB."
    );

    input.value="";

    return;
  }

  try{

    const form =
      new FormData();

    form.append(
      "file",
      file
    );

    const response =
      await fetch(
        "/api/upload",
        {
          method:"POST",
          headers:
            authHeaders(),
          body:form
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      alert(
        data.error ||
        "Upload failed"
      );

      return;
    }

    socket.emit(
      "private-message",
      {
        senderId:
          currentUser.id,

        receiverId:
          selectedUser.id,

        message:
          "📎 " +
          data.file.name,

        messageType:
          "file",

        fileName:
          data.file.name,

        fileUrl:
          data.file.url,

        fileSize:
          data.file.size
      }
    );

  }catch(error){

    console.error(
      error
    );

    alert(
      "File upload failed"
    );

  }finally{

    input.value="";

  }

}

async function startCall(
  callType
){

  if(!selectedUser){

    alert(
      "Select a user first"
    );

    return;
  }

  try{

    localStream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio:true,
          video:
            callType ===
            "video"
        });

    showLocalStream();

    peerConnection =
      createPeerConnection(
        selectedUser.id
      );

    localStream
      .getTracks()
      .forEach(
        track=>{
          peerConnection.addTrack(
            track,
            localStream
          );
        }
      );

    const offer =
      await peerConnection
        .createOffer();

    await peerConnection
      .setLocalDescription(
        offer
      );

    socket.emit(
      "start-call",
      {
        receiverId:
          selectedUser.id,

        callerId:
          currentUser.id,

        callerName:
          currentUser.username,

        callType
      }
    );

    socket.emit(
      "call-offer",
      {
        receiverId:
          selectedUser.id,

        callerId:
          currentUser.id,

        callerName:
          currentUser.username,

        callType,

        offer
      }
    );

  }catch(error){

    console.error(
      error
    );

    alert(
      "Microphone/camera permission is required."
    );

    closeCall();

  }

}


/* =====================================================
   PEER CONNECTION
===================================================== */

function createPeerConnection(
  remoteUserId
){

  const pc =
    new RTCPeerConnection(
      rtcConfig
    );

  pc.onicecandidate =
    event=>{

      if(
        event.candidate &&
        socket
      ){

        socket.emit(
          "ice-candidate",
          {
            receiverId:
              remoteUserId,

            candidate:
              event.candidate
          }
        );

      }

    };


  pc.ontrack =
    event=>{

      const remote =
        document.getElementById(
          "remoteVideo"
        );

      if(
        event.streams &&
        event.streams[0]
      ){

        remote.srcObject =
          event.streams[0];

      }

    };


  pc.onconnectionstatechange =
    ()=>{

      if(
        pc.connectionState ===
        "failed" ||
        pc.connectionState ===
        "closed"
      ){

        closeCall();

      }

    };


  return pc;

}


/* =====================================================
   ACCEPT CALL
===================================================== */

async function acceptCall(){

  document
    .getElementById(
      "incomingCall"
    )
    .classList.add(
      "hidden"
    );

  if(!incomingCallData)
    return;

  const data =
    incomingCallData;

  selectedUser = {
    id:
      data.callerId,

    username:
      data.callerName ||
      "Caller"
  };

  document.getElementById(
    "chatUserName"
  ).textContent =
    selectedUser.username;

  try{

    localStream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio:true,

          video:
            data.callType ===
            "video"
        });

    showLocalStream();

    peerConnection =
      createPeerConnection(
        data.callerId
      );

    localStream
      .getTracks()
      .forEach(
        track=>{
          peerConnection.addTrack(
            track,
            localStream
          );
        }
      );

    const offer =
      data.offer ||
      pendingOffer;

    if(offer){

      await acceptRemoteOffer({
        ...data,
        offer
      });

    }

  }catch(error){

    console.error(
      error
    );

    alert(
      "Could not access microphone/camera."
    );

    closeCall();

  }

}


/* =====================================================
   REMOTE OFFER
===================================================== */

async function acceptRemoteOffer(
  data
){

  if(!peerConnection)
    return;

  try{

    await peerConnection
      .setRemoteDescription(
        new RTCSessionDescription(
          data.offer
        )
      );

    const answer =
      await peerConnection
        .createAnswer();

    await peerConnection
      .setLocalDescription(
        answer
      );

    socket.emit(
      "call-answer",
      {
        receiverId:
          data.callerId,

        answer
      }
    );

    pendingOffer =
      null;

    await flushIce();

  }catch(error){

    console.error(
      "Remote offer:",
      error
    );

  }

}


async function flushIce(){

  if(
    !peerConnection ||
    !peerConnection.remoteDescription
  )
    return;

  while(
    iceQueue.length
  ){

    const candidate =
      iceQueue.shift();

    try{

      await peerConnection
        .addIceCandidate(
          new RTCIceCandidate(
            candidate
          )
        );

    }catch(error){

      console.error(
        error
      );

    }

  }

}

/* =====================================================
   SCREEN SHARE
===================================================== */

async function shareScreen(){

  if(!selectedUser){

    alert(
      "Select a user first"
    );

    return;
  }

  if(!peerConnection){

    alert(
      "Start a video call first."
    );

    return;
  }

  try{

    const screenStream =
      await navigator
        .mediaDevices
        .getDisplayMedia({
          video:true,
          audio:true
        });

    const screenTrack =
      screenStream
        .getVideoTracks()[0];

    const sender =
      peerConnection
        .getSenders()
        .find(
          s =>
            s.track &&
            s.track.kind ===
            "video"
        );

    if(sender){

      await sender
        .replaceTrack(
          screenTrack
        );

    }

    document.getElementById(
      "localVideo"
    ).srcObject =
      screenStream;

    screenTrack.onended =
      async ()=>{

        const camera =
          localStream
            ?.getVideoTracks()[0];

        if(
          camera &&
          sender
        ){

          await sender
            .replaceTrack(
              camera
            );

        }

        if(localStream){

          document.getElementById(
            "localVideo"
          ).srcObject =
            localStream;

        }

      };

  }catch(error){

    console.error(
      "Screen share:",
      error
    );

  }

}


/* =====================================================
   END CALL
===================================================== */

function endCall(){

  if(
    selectedUser &&
    socket
  ){

    socket.emit(
      "end-call",
      {
        receiverId:
          selectedUser.id
      }
    );

  }

  closeCall();

}


function closeCall(){

  if(peerConnection){

    peerConnection.close();

    peerConnection =
      null;

  }

  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track=>{
          track.stop();
        }
      );

    localStream =
      null;

  }

  iceQueue=[];

  pendingOffer=null;

  document.getElementById(
    "localVideo"
  ).srcObject=null;

  document.getElementById(
    "remoteVideo"
  ).srcObject=null;

  document
    .getElementById(
      "videoPanel"
    )
    .classList.add(
      "hidden"
    );

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

  closeCall();

  if(socket){

    socket.disconnect();

    socket=null;

  }

  localStorage.removeItem(
    "rtc_token"
  );

  localStorage.removeItem(
    "rtc_user"
  );

  currentUser=null;
  selectedUser=null;

  document
    .getElementById(
      "appScreen"
    )
    .classList.add(
      "hidden"
    );

  document
    .getElementById(
      "authScreen"
    )
    .classList.remove(
      "hidden"
    );

}


/* =====================================================
   SCROLL
===================================================== */

function scrollMessages(){

  const box =
    document.getElementById(
      "messages"
    );

  setTimeout(
    ()=>{
      box.scrollTop =
        box.scrollHeight;
    },
    20
  );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(
  text
){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    String(
      text ?? ""
    );

  return div.innerHTML;

}


function escapeAttribute(
  text
){

  return String(
    text ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    );

}


/* =====================================================
   AUTO LOGIN
===================================================== */

async function autoLogin(){

  const token =
    localStorage.getItem(
      "rtc_token"
    );

  const saved =
    localStorage.getItem(
      "rtc_user"
    );

  if(
    !token ||
    !saved
  )
    return;

  try{

    currentUser =
      JSON.parse(
        saved
      );

    const response =
      await fetch(
        "/api/me",
        {
          headers:
            authHeaders()
        }
      );

    if(!response.ok){

      logout();

      return;
    }

    currentUser =
      await response.json();

    localStorage.setItem(
      "rtc_user",
      JSON.stringify(
        currentUser
      )
    );

    openApp();

  }catch(error){

    console.error(
      "Auto login:",
      error
    );

    localStorage.removeItem(
      "rtc_token"
    );

    localStorage.removeItem(
      "rtc_user"
    );

    currentUser=null;

  }

}


/* =====================================================
   START
===================================================== */

window.addEventListener(
  "load",
  ()=>{
    autoLogin();
  }
);


/* =====================================================
   SERVICE WORKER
===================================================== */

if(
  "serviceWorker" in
  navigator
){

  window.addEventListener(
    "load",
    ()=>{
      navigator.serviceWorker
        .register(
          "/service-worker.js"
        )
        .catch(
          error =>
            console.error(
              "Service Worker:",
              error
            )
        );
    }
  );

}
