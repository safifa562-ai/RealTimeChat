<!-- RealTimeChat Feature Toolbar -->
<section id="newFeatureToolbar"
  style="padding:12px;background:#151922;color:white;
  border-radius:12px;margin:12px 0;">

  <h3>✨ New Chat Features</h3>

  <input id="chatFilter"
    placeholder="Search messages..."
    oninput="filterChatMessages()"
    style="padding:10px;width:65%;border-radius:8px;">

  <button onclick="toggleAppLock()"
    style="padding:10px;border-radius:8px;">
    🔒 App Lock
  </button>

  <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
    <button onclick="startVoiceNote()">🎙️ Voice Note</button>
    <button onclick="editSelectedMessage()">✏️ Edit</button>
    <button onclick="deleteSelectedMessage()">🗑️ Delete</button>
  </div>

  <p id="featureStatus" aria-live="polite"></p>
</section>

<script>
let voiceRecorder;
let voiceChunks = [];
let selectedMessageElement = null;

function featureStatus(message) {
  const el = document.getElementById("featureStatus");
  if (el) el.textContent = message;
}

function filterChatMessages() {
  const query = document.getElementById("chatFilter")
    .value.toLowerCase();

  document.querySelectorAll(".message").forEach(message => {
    message.style.display =
      message.innerText.toLowerCase().includes(query)
        ? ""
        : "none";
  });
}

function toggleAppLock() {
  const locked = sessionStorage.getItem("rtc_locked") === "yes";

  if (!locked) {
    const pin = prompt("Create a temporary app PIN (4+ digits):");
    if (!pin || !/^\d{4,}$/.test(pin)) {
      featureStatus("PIN must contain at least 4 digits.");
      return;
    }

    sessionStorage.setItem("rtc_pin", pin);
    sessionStorage.setItem("rtc_locked", "yes");
    featureStatus("App lock enabled for this session.");
  } else {
    const pin = prompt("Enter your app PIN:");
    if (pin !== sessionStorage.getItem("rtc_pin")) {
      featureStatus("Incorrect PIN.");
      return;
    }

    sessionStorage.removeItem("rtc_locked");
    sessionStorage.removeItem("rtc_pin");
    featureStatus("App lock disabled.");
  }
}

async function startVoiceNote() {
  if (!navigator.mediaDevices?.getUserMedia) {
    featureStatus("Microphone requires HTTPS and browser support.");
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    voiceChunks = [];
    voiceRecorder = new MediaRecorder(stream);

    voiceRecorder.ondataavailable = event => {
      if (event.data.size) voiceChunks.push(event.data);
    };

    voiceRecorder.onstop = () => {
      const audio = new Blob(voiceChunks, {
        type: voiceRecorder.mimeType || "audio/webm"
      });

      const url = URL.createObjectURL(audio);
      const player = document.createElement("audio");
      player.controls = true;
      player.src = url;

      document.getElementById("featureStatus")
        .replaceChildren(player);

      stream.getTracks().forEach(track => track.stop());
    };

    voiceRecorder.start();
    featureStatus("Recording... click Voice Note again to stop.");

    document.querySelector(
      '#newFeatureToolbar button[onclick="startVoiceNote()"]'
    ).onclick = () => {
      if (voiceRecorder?.state === "recording") {
        voiceRecorder.stop();
      }
    };
  } catch (error) {
    featureStatus("Microphone permission was not granted.");
  }
}

function editSelectedMessage() {
  featureStatus(
    "Message editing needs a server endpoint and message selection."
  );
}

function deleteSelectedMessage() {
  featureStatus(
    "Delete for everyone needs a server endpoint and message selection."
  );
}
</script>
